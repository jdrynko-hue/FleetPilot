name: Verify offline QA release evidence

on:
  pull_request:
    paths:
      - '.github/workflows/qa-release-evidence.yml'
      - 'tools/verify_qa_release_evidence.py'
      - 'tools/test_qa_release_evidence.py'
      - 'tools/prepare_booking_qa.py'
      - 'tools/prepare_qa_booking_swap.py'
      - 'tools/qa_artifact_integrity.py'
      - 'tools/prepare_marketing_release.py'
      - 'web/app/index.html'
      - 'web/favicon.png'
      - 'web/icons/**'
      - 'web/manifest.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/qa-release-evidence.yml'
      - 'tools/verify_qa_release_evidence.py'
      - 'tools/test_qa_release_evidence.py'
      - 'tools/prepare_booking_qa.py'
      - 'tools/prepare_qa_booking_swap.py'
      - 'tools/qa_artifact_integrity.py'
      - 'tools/prepare_marketing_release.py'
      - 'web/app/index.html'
      - 'web/favicon.png'
      - 'web/icons/**'
      - 'web/manifest.json'

permissions:
  contents: read

jobs:
  offline-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B tools/test_qa_release_evidence.py -v
