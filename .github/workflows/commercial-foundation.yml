      - name: Add commercial models
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("lib/data/models.dart")
          s = p.read_text()

          marker = "class Vehicle {"

          commercial = r'''
          class UserProfile {
            UserProfile({
              required this.userId,
              required this.locale,
              this.displayName,
            });

            final String userId;
            final String locale;
            final String? displayName;

            factory UserProfile.fromJson(Json json) => UserProfile(
                  userId: json['user_id'].toString(),
                  locale: json['locale']?.toString() ?? 'en',
                  displayName: json['display_name']?.toString(),
                );
          }

          class CompanyMember {
            CompanyMember({
              required this.userId,
              required this.email,
              required this.role,
              required this.joinedAt,
              this.displayName,
            });

            final String userId;
            final String email;
            final String? displayName;
            final String role;
            final DateTime joinedAt;

            factory CompanyMember.fromJson(Json json) => CompanyMember(
                  userId: json['user_id'].toString(),
                  email: json['email']?.toString() ?? '',
                  displayName: json['display_name']?.toString(),
                  role: json['role']?.toString() ?? 'viewer',
                  joinedAt:
                      parseDate(json['joined_at']) ?? DateTime.now(),
                );
          }

          class CompanyInvite {
            CompanyInvite({
              required this.id,
              required this.email,
              required this.role,
              required this.inviteCode,
              required this.status,
              required this.expiresAt,
              required this.createdAt,
            });

            final String id;
            final String email;
            final String role;
            final String inviteCode;
            final String status;
            final DateTime expiresAt;
            final DateTime createdAt;

            factory CompanyInvite.fromJson(Json json) => CompanyInvite(
                  id: json['id'].toString(),
                  email: json['email']?.toString() ?? '',
                  role: json['role']?.toString() ?? 'manager',
                  inviteCode: json['invite_code'].toString(),
                  status: json['status']?.toString() ?? 'pending',
                  expiresAt:
                      parseDate(json['expires_at']) ?? DateTime.now(),
                  createdAt:
                      parseDate(json['created_at']) ?? DateTime.now(),
                );
          }

          '''

          if "class UserProfile {" not in s:
              s = s.replace(marker, commercial + marker)

          p.write_text(s)
          PY

      - name: Add commercial repository functions
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path("lib/data/fleet_repository.dart")
          s = p.read_text()

          s = s.replace(
          """Future<bool> signUp({required String email, required String password}) async {
              final response = await _client.auth.signUp(email: email, password: password);
              return response.session != null;
            }""",
          """Future<bool> signUp({
              required String email,
              required String password,
              String locale = 'en',
            }) async {
              final response = await _client.auth.signUp(
                email: email,
                password: password,
                data: {'locale': locale},
              );
              return response.session != null;
            }"""
          )

          insert = r'''
            Future<UserProfile?> fetchUserProfile() async {
              final user = currentUser;
              if (user == null) return null;

              final row = await _client
                  .from('user_profiles')
                  .select()
                  .eq('user_id', user.id)
                  .maybeSingle();

              if (row == null) return null;
              return UserProfile.fromJson(row);
            }

            Future<void> updateUserLocale(String locale) async {
              final user = currentUser;
              if (user == null) return;

              await _client.from('user_profiles').upsert({
                'user_id': user.id,
                'locale': locale,
              });
            }

            Future<List<CompanyMember>> fetchCompanyMembers(
              String companyId,
            ) async {
              final rows = await _client.rpc(
                'list_company_members',
                params: {'_company_id': companyId},
              );

              return (rows as List)
                  .map(
                    (row) => CompanyMember.fromJson(
                      (row as Map).cast<String, dynamic>(),
                    ),
                  )
                  .toList();
            }

            Future<List<CompanyInvite>> fetchCompanyInvites(
              String companyId,
            ) async {
              final rows = await _client.rpc(
                'list_company_invites',
                params: {'_company_id': companyId},
              );

              return (rows as List)
                  .map(
                    (row) => CompanyInvite.fromJson(
                      (row as Map).cast<String, dynamic>(),
                    ),
                  )
                  .toList();
            }

            Future<String> createCompanyInvite({
              required String companyId,
              required String email,
              required String role,
            }) async {
              final code = await _client.rpc(
                'create_company_invite',
                params: {
                  '_company_id': companyId,
                  '_email': email,
                  '_role': role,
                },
              );

              return code.toString();
            }

            Future<void> acceptCompanyInvite(String code) async {
              await _client.rpc(
                'accept_company_invite',
                params: {'_invite_code': code},
              );
            }

            Future<void> updateCompanyMemberRole({
              required String companyId,
              required String userId,
              required String role,
            }) async {
              await _client.rpc(
                'update_company_member_role',
                params: {
                  '_company_id': companyId,
                  '_user_id': userId,
                  '_role': role,
                },
              );
            }

            Future<void> removeCompanyMember({
              required String companyId,
              required String userId,
            }) async {
              await _client.rpc(
                'remove_company_member',
                params: {
                  '_company_id': companyId,
                  '_user_id': userId,
                },
              );
            }

            Future<void> revokeCompanyInvite(String inviteId) async {
              await _client.rpc(
                'revoke_company_invite',
                params: {'_invite_id': inviteId},
              );
            }

          '''

          pos = s.rfind("}")
          if "fetchUserProfile()" not in s:
              s = s[:pos] + insert + s[pos:]

          p.write_text(s)
          PY

      - name: Localize status values
        run: |
          cat > lib/core/constants.dart <<'DART'
          import 'localization.dart';

          const vehicleStatuses = <String>[
            'available',
            'in_use',
            'workshop',
            'maintenance',
            'off_road',
            'sold',
          ];

          const driverStatuses = <String>[
            'active',
            'inactive',
            'holiday',
            'suspended',
          ];

          const issuePriorities = <String>[
            'low',
            'medium',
            'high',
            'critical',
          ];

          const issueStatuses = <String>[
            'open',
            'booked',
            'in_progress',
            'resolved',
            'closed',
          ];

          const repairStatuses = <String>[
            'planned',
            'booked',
            'in_progress',
            'ready',
            'completed',
            'cancelled',
          ];

          const companyRoles = <String>[
            'owner',
            'admin',
            'manager',
            'viewer',
          ];

          bool canManageForRole(String role) =>
              role == 'owner' ||
              role == 'admin' ||
              role == 'manager';

          String prettifyEnum(String value) {
            const translatable = {
              'available',
              'in_use',
              'workshop',
              'maintenance',
              'off_road',
              'sold',
              'active',
              'inactive',
              'holiday',
              'suspended',
              'low',
              'medium',
              'high',
              'critical',
              'open',
              'booked',
              'in_progress',
              'resolved',
              'closed',
              'planned',
              'ready',
              'completed',
              'cancelled',
              'owner',
              'admin',
              'manager',
              'viewer',
            };

            if (translatable.contains(value)) {
              return tr(value);
            }

            if (value.isEmpty) return value;

            return value
                .split('_')
                .map(
                  (part) => part.isEmpty
                      ? part
                      : '${part[0].toUpperCase()}${part.substring(1)}',
                )
                .join(' ');
          }
          DART

