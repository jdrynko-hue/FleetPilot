            final _repository = FleetRepository();
            final _inviteCode = TextEditingController();

            late Future<List<CompanyMember>> _members;
            Future<List<CompanyInvite>>? _invites;

            bool get _canAdmin =>
                widget.company.role == 'owner' ||
                widget.company.role == 'admin';

            @override
            void initState() {
              super.initState();
              _reload();
            }

            @override
            void didUpdateWidget(
              covariant CompanyScreen oldWidget,
            ) {
              super.didUpdateWidget(oldWidget);

              if (oldWidget.company.companyId !=
                  widget.company.companyId) {
                _reload();
              }
            }

            @override
            void dispose() {
              _inviteCode.dispose();
              super.dispose();
            }

            void _reload() {
              _members = _repository.fetchCompanyMembers(
                widget.company.companyId,
              );

              if (_canAdmin) {
                _invites =
                    _repository.fetchCompanyInvites(
                  widget.company.companyId,
                );
              } else {
                _invites = null;
              }
            }

            Future<void> _changeLanguage(
              String value,
            ) async {
              await _repository.updateUserLocale(value);
              AppLocale.language.value = value;

              if (mounted) setState(() {});
            }

            Future<void> _createInvite() async {
              final email = TextEditingController();
              var role = 'manager';

              final result =
                  await showDialog<Map<String, String>>(
                context: context,
                builder: (context) => StatefulBuilder(
                  builder: (context, setDialogState) {
                    return AlertDialog(
                      title: Text(tr('invite_member')),
                      content: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          TextField(
                            controller: email,
                            keyboardType:
                                TextInputType.emailAddress,
                            decoration: InputDecoration(
                              labelText: tr('email'),
                            ),
                          ),
                          const SizedBox(height: 16),
                          DropdownButtonFormField<String>(
                            initialValue: role,
                            decoration: InputDecoration(
                              labelText: tr('role'),
                            ),
                            items: const [
                              DropdownMenuItem(
                                value: 'admin',
                                child: Text('Admin'),
                              ),
                              DropdownMenuItem(
                                value: 'manager',
                                child: Text('Manager'),
                              ),
                              DropdownMenuItem(
                                value: 'viewer',
                                child: Text('Viewer'),
                              ),
                            ],
                            onChanged: (value) {
                              if (value != null) {
                                setDialogState(
                                  () => role = value,
                                );
                              }
                            },
                          ),
                        ],
                      ),
                      actions: [
                        TextButton(
                          onPressed: () =>
                              Navigator.pop(context),
                          child: const Text('Cancel'),
                        ),
                        FilledButton(
                          onPressed: () =>
                              Navigator.pop(
                            context,
                            {
                              'email':
                                  email.text.trim(),
                              'role': role,
                            },
                          ),
                          child:
                              Text(tr('create_invite')),
                        ),
                      ],
                    );
                  },
                ),
              );

              email.dispose();

              if (result == null ||
                  result['email']!.isEmpty) {
                return;
              }

              try {
                final code =
                    await _repository.createCompanyInvite(
                  companyId:
                      widget.company.companyId,
                  email: result['email']!,
                  role: result['role']!,
                );

                final params =
                    Map<String, String>.from(
                  Uri.base.queryParameters,
                );

                params['invite'] = code;

                final link = Uri.base
                    .replace(queryParameters: params)
                    .toString();

                await Clipboard.setData(
                  ClipboardData(text: link),
                );

                if (!mounted) return;

                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content: Text(
                      tr('invite_created'),
                    ),
                  ),
                );

                setState(_reload);
              } catch (error) {
                if (!mounted) return;

                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content: Text(error.toString()),
                  ),
                );
              }
            }

            Future<void> _acceptCode() async {
              final code =
                  _inviteCode.text.trim();

              if (code.isEmpty) return;

              try {
                await _repository
                    .acceptCompanyInvite(code);

                _inviteCode.clear();

                await widget.onMembershipChanged();

                if (!mounted) return;

                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  const SnackBar(
                    content: Text(
                      'Company added successfully.',
                    ),
                  ),
                );
              } catch (error) {
                if (!mounted) return;

                ScaffoldMessenger.of(context)
                    .showSnackBar(
                  SnackBar(
                    content: Text(error.toString()),
                  ),
                );
              }
            }

            Future<void> _updateRole(
              CompanyMember member,
              String role,
            ) async {
              await _repository.updateCompanyMemberRole(
                companyId:
                    widget.company.companyId,
                userId: member.userId,
                role: role,
              );

              setState(_reload);
            }

            Future<void> _removeMember(
              CompanyMember member,
            ) async {
              await _repository.removeCompanyMember(
                companyId:
                    widget.company.companyId,
                userId: member.userId,
              );

              setState(_reload);
            }

            Future<void> _revokeInvite(
              CompanyInvite invite,
            ) async {
              await _repository
                  .revokeCompanyInvite(invite.id);

              setState(_reload);
            }

            @override
            Widget build(BuildContext context) {
              final currentUserId =
                  _repository.currentUser?.id;

              return ListView(
                padding:
                    const EdgeInsets.fromLTRB(
                  16,
                  18,
                  16,
                  32,
                ),
                children: [
                  Text(
                    tr('company'),
                    style: Theme.of(context)
                        .textTheme
                        .headlineMedium,
                  ),
                  const SizedBox(height: 16),

                  Card(
                    child: Padding(
                      padding:
                          const EdgeInsets.all(20),
                      child: Column(
                        crossAxisAlignment:
                            CrossAxisAlignment.start,
                        children: [
                          Text(
                            widget.company.companyName,
                            style: Theme.of(context)
                                .textTheme
                                .titleLarge,
                          ),
                          const SizedBox(height: 8),
                          Text(
                            '${tr('your_role')}: ${prettifyEnum(widget.company.role)}',
                          ),
                          Text(
                            '${tr('currency')}: ${widget.company.currency}',
                          ),
                        ],
                      ),
                    ),
                  ),

                  const SizedBox(height: 16),

                  Card(
                    child: Padding(
                      padding:
                          const EdgeInsets.all(20),
                      child: Row(
                        children: [
                          const Icon(
                            Icons.language_rounded,
                          ),
                          const SizedBox(width: 14),
                          Expanded(
                            child: Text(
                              tr('language'),
                              style: Theme.of(context)
                                  .textTheme
                                  .titleMedium,
                            ),
                          ),
                          DropdownButton<String>(
                            value:
                                AppLocale.language.value,
                            items: [
                              DropdownMenuItem(
                                value: 'pl',
                                child: Text(
                                  '🇵🇱 ${tr('polish')}',
                                ),
                              ),
                              DropdownMenuItem(
                                value: 'en',
                                child: Text(
                                  '🇬🇧 ${tr('english')}',
                                ),
                              ),
                            ],
                            onChanged: (value) {
                              if (value != null) {
                                _changeLanguage(value);
                              }
                            },
                          ),
                        ],
                      ),
                    ),
                  ),

                  const SizedBox(height: 24),

                  Row(
                    children: [
                      Expanded(
                        child: Column(
                          crossAxisAlignment:
                              CrossAxisAlignment.start,
                          children: [
                            Text(
                              tr('team'),
                              style: Theme.of(context)
                                  .textTheme
                                  .titleLarge,
                            ),
                            const SizedBox(height: 3),
                            Text(
                              tr('team_description'),
                            ),
                          ],
                        ),
                      ),
                      if (_canAdmin)
                        FilledButton.icon(
                          onPressed: _createInvite,
                          icon:
                              const Icon(Icons.person_add),
                          label: Text(
                            tr('invite_member'),
                          ),
                        ),
                    ],
                  ),

                  const SizedBox(height: 12),

                  FutureBuilder<List<CompanyMember>>(
                    future: _members,
                    builder: (context, snapshot) {
                      if (!snapshot.hasData) {
                        return const Card(
                          child: Padding(
                            padding:
                                EdgeInsets.all(30),
                            child: Center(
                              child:
                                  CircularProgressIndicator(),
                            ),
                          ),
                        );
                      }

                      final members =
                          snapshot.data!;

                      return Card(
                        child: Column(
                          children: [
                            for (var i = 0;
                                i < members.length;
                                i++) ...[
                              ListTile(
                                leading: CircleAvatar(
                                  child: Text(
                                    (members[i]
                                                    .displayName ??
                                                members[i]
                                                    .email)
                                            .isEmpty
                                        ? '?'
                                        : (members[i]
                                                    .displayName ??
                                                members[i]
                                                    .email)[0]
                                            .toUpperCase(),
                                  ),
                                ),
                                title: Text(
                                  members[i]
                                          .displayName ??
                                      members[i].email,
                                ),
                                subtitle: Text(
                                  '${members[i].email} • ${formatDate(members[i].joinedAt)}',
                                ),
                                trailing: members[i].role ==
                                        'owner'
                                    ? Text(
                                        tr('owner'),
                                      )
                                    : _canAdmin &&
                                            members[i]
                                                    .userId !=
                                                currentUserId
                                        ? PopupMenuButton<
                                            String>(
                                            onSelected:
                                                (value) {
                                              if (value ==
                                                  'remove') {
                                                _removeMember(
                                                  members[i],
                                                );
                                              } else {
                                                _updateRole(
                                                  members[i],
                                                  value,
                                                );
                                              }
                                            },
                                            itemBuilder: (_) => [
                                              PopupMenuItem(
                                                value:
                                                    'admin',
                                                child: Text(
                                                  tr('admin'),
                                                ),
                                              ),
                                              PopupMenuItem(
                                                value:
                                                    'manager',
                                                child: Text(
                                                  tr(
                                                    'manager',
                                                  ),
                                                ),
                                              ),
                                              PopupMenuItem(
                                                value:
                                                    'viewer',
                                                child: Text(
                                                  tr(
                                                    'viewer',
                                                  ),
                                                ),
                                              ),
                                              const PopupMenuDivider(),
                                              PopupMenuItem(
                                                value:
                                                    'remove',
                                                child: Text(
                                                  tr(
                                                    'remove',
                                                  ),
                                                ),
                                              ),
                                            ],
                                            child: Text(
                                              prettifyEnum(
                                                members[i]
                                                    .role,
                                              ),
                                            ),
                                          )
                                        : Text(
                                            prettifyEnum(
                                              members[i].role,
                                            ),
                                          ),
                              ),
                              if (i !=
                                  members.length - 1)
                                const Divider(
                                  height: 1,
                                ),
                            ],
                          ],
                        ),
                      );
                    },
                  ),

                  if (_canAdmin &&
                      _invites != null) ...[
                    const SizedBox(height: 24),
                    Text(
                      tr('pending_invites'),
                      style: Theme.of(context)
                          .textTheme
                          .titleLarge,
                    ),
                    const SizedBox(height: 10),
                    FutureBuilder<
                        List<CompanyInvite>>(
                      future: _invites,
                      builder:
                          (context, snapshot) {
                        if (!snapshot.hasData) {
                          return const SizedBox(
                            height: 40,
                            child: Center(
                              child:
                                  CircularProgressIndicator(),
                            ),
                          );
                        }

                        final invites = snapshot.data!
                            .where(
                              (invite) =>
                                  invite.status ==
                                  'pending',
                            )
                            .toList();

                        if (invites.isEmpty) {
                          return Card(
                            child: Padding(
                              padding:
                                  const EdgeInsets.all(
                                18,
                              ),
                              child: Text(
                                tr('no_invites'),
                              ),
                            ),
                          );
                        }

                        return Card(
                          child: Column(
                            children: [
                              for (var i = 0;
                                  i < invites.length;
                                  i++) ...[
                                ListTile(
                                  leading:
                                      const Icon(
                                    Icons
                                        .mail_outline_rounded,
                                  ),
                                  title: Text(
                                    invites[i].email,
                                  ),
                                  subtitle: Text(
                                    '${prettifyEnum(invites[i].role)} • ${formatDate(invites[i].expiresAt)}',
                                  ),
                                  trailing:
                                      TextButton(
                                    onPressed: () =>
                                        _revokeInvite(
                                      invites[i],
                                    ),
                                    child: Text(
                                      tr('revoke'),
                                    ),
                                  ),
                                ),
                                if (i !=
                                    invites.length - 1)
                                  const Divider(
                                    height: 1,
                                  ),
                              ],
                            ],
                          ),
                        );
                      },
                    ),
                  ],

                  const SizedBox(height: 24),

                  Text(
                    tr('join_company'),
                    style: Theme.of(context)
                        .textTheme
                        .titleLarge,
                  ),

                  const SizedBox(height: 10),

                  Card(
                    child: Padding(
                      padding:
                          const EdgeInsets.all(18),
                      child: Row(
                        children: [
                          Expanded(
                            child: TextField(
                              controller: _inviteCode,
                              decoration:
                                  InputDecoration(
                                labelText:
                                    tr('invite_code'),
                              ),
                            ),
                          ),
                          const SizedBox(width: 10),
                          FilledButton(
                            onPressed: _acceptCode,
                            child: Text(
                              tr('accept_invite'),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),

                  const SizedBox(height: 24),

                  OutlinedButton.icon(
                    onPressed: () =>
                        _repository.signOut(),
                    icon:
                        const Icon(Icons.logout),
                    label: Text(tr('sign_out')),
                  ),
                ],
              );
            }
          }
          DART

      - name: Upgrade multi-company navigation
        run: |
          cat > lib/shell/fleet_shell.dart <<'DART'
          import 'package:flutter/material.dart';

          import '../company/company_screen.dart';
          import '../core/constants.dart';
          import '../core/localization.dart';
          import '../dashboard/dashboard_screen.dart';
          import '../data/fleet_repository.dart';
          import '../data/models.dart';
          import '../drivers/drivers_screen.dart';
          import '../garages/garages_screen.dart';
          import '../issues/issues_screen.dart';
          import '../repairs/repairs_screen.dart';
          import '../vehicles/vehicles_screen.dart';

          class FleetShell extends StatefulWidget {
            const FleetShell({
              required this.memberships,
              super.key,
            });

            final List<CompanyMembership> memberships;

            @override
            State<FleetShell> createState() =>
                _FleetShellState();
          }

          class _FleetShellState extends State<FleetShell> {
            final _repository = FleetRepository();

            late List<CompanyMembership> _memberships;
            late CompanyMembership _membership;

            int _index = 0;
            int _refreshToken = 0;

            @override
            void initState() {
              super.initState();

              _memberships =
                  List.from(widget.memberships);

              _membership = _memberships.first;
            }

            void _refreshAll() {
              setState(() => _refreshToken++);
            }

            Future<void> _reloadMemberships() async {
              final memberships =
                  await _repository.fetchMemberships();

              if (memberships.isEmpty || !mounted) {
                return;
              }

              setState(() {
                final currentId =
                    _membership.companyId;

                _memberships = memberships;

                _membership =
                    memberships.firstWhere(
                  (m) => m.companyId == currentId,
                  orElse: () =>
                      memberships.first,
                );

                _refreshToken++;
              });
            }

            @override
            Widget build(BuildContext context) {
              final canManage =
                  canManageForRole(_membership.role);

              final pages = [
                DashboardScreen(
                  company: _membership,
                  refreshToken: _refreshToken,
                ),
                VehiclesScreen(
                  company: _membership,
                  canManage: canManage,
                  refreshToken: _refreshToken,
                  onDataChanged: _refreshAll,
                ),
                DriversScreen(
                  company: _membership,
                  canManage: canManage,
                  refreshToken: _refreshToken,
                  onDataChanged: _refreshAll,
                ),
                IssuesScreen(
                  company: _membership,
                  canManage: canManage,
                  refreshToken: _refreshToken,
                  onDataChanged: _refreshAll,
                ),
                RepairsScreen(
                  company: _membership,
                  canManage: canManage,
                  refreshToken: _refreshToken,
                  onDataChanged: _refreshAll,
                ),
                GaragesScreen(
                  company: _membership,
                  canManage: canManage,
                  refreshToken: _refreshToken,
                  onDataChanged: _refreshAll,
                ),
                CompanyScreen(
                  company: _membership,
                  onMembershipChanged:
                      _reloadMemberships,
                ),
              ];

              return LayoutBuilder(
                builder: (context, constraints) {
                  final wide =
                      constraints.maxWidth >= 900;

                  final body = IndexedStack(
                    index: _index,
                    children: pages,
                  );

                  return Scaffold(
                    appBar: AppBar(
                      title: const Text('FleetPilot'),
                      actions: [
                        if (_memberships.length > 1)
                          Padding(
                            padding:
                                const EdgeInsets.symmetric(
                              horizontal: 8,
                            ),
                            child:
                                DropdownButtonHideUnderline(
                              child: DropdownButton<
                                  String>(
                                dropdownColor:
                                    const Color(
                                  0xFF102A43,
                                ),
                                style: const TextStyle(
                                  color: Colors.white,
                                ),
                                iconEnabledColor:
                                    Colors.white,
                                value:
                                    _membership.companyId,
                                items: _memberships
                                    .map(
                                      (m) =>
                                          DropdownMenuItem(
                                        value:
                                            m.companyId,
                                        child: Text(
                                          m.companyName,
                                        ),
                                      ),
                                    )
                                    .toList(),
                                onChanged: (id) {
                                  if (id == null) {
                                    return;
                                  }

                                  setState(() {
                                    _membership =
                                        _memberships
                                            .firstWhere(
                                      (m) =>
                                          m.companyId ==
                                          id,
                                    );

                                    _index = 0;
                                    _refreshToken++;
                                  });
                                },
                              ),
                            ),
                          )
                        else
                          Padding(
                            padding:
                                const EdgeInsets.symmetric(
                              horizontal: 8,
                            ),
                            child: Center(
                              child: Text(
                                _membership.companyName,
                              ),
                            ),
                          ),
                        IconButton(
                          tooltip: tr('refresh'),
                          onPressed: _refreshAll,
                          icon:
                              const Icon(Icons.refresh),
                        ),
                        IconButton(
                          tooltip: tr('sign_out'),
                          onPressed: () =>
                              _repository.signOut(),
                          icon:
                              const Icon(Icons.logout),
                        ),
                      ],
                    ),
                    body: wide
                        ? Row(
                            children: [
                              NavigationRail(
                                selectedIndex: _index,
                                onDestinationSelected:
                                    (value) => setState(
                                  () => _index = value,
                                ),
                                labelType:
                                    NavigationRailLabelType
                                        .all,
                                destinations: [
                                  NavigationRailDestination(
                                    icon: const Icon(
                                      Icons
                                          .dashboard_outlined,
                                    ),
                                    label: Text(
                                      tr('dashboard'),
                                    ),
                                  ),
                                  NavigationRailDestination(
                                    icon: const Icon(
                                      Icons
                                          .local_shipping_outlined,
                                    ),
                                    label: Text(
                                      tr('vehicles'),
                                    ),
                                  ),
                                  NavigationRailDestination(
                                    icon: const Icon(
                                      Icons.people_outline,
                                    ),
                                    label: Text(
                                      tr('drivers'),
                                    ),
                                  ),
                                  NavigationRailDestination(
                                    icon: const Icon(
                                      Icons
                                          .report_problem_outlined,
                                    ),
                                    label: Text(
                                      tr('issues'),
                                    ),
                                  ),
                                  NavigationRailDestination(
                                    icon: const Icon(
                                      Icons.build_outlined,
                                    ),
                                    label: Text(
                                      tr('repairs'),
                                    ),
                                  ),
                                  NavigationRailDestination(
                                    icon: const Icon(
                                      Icons.garage_outlined,
                                    ),
                                    label: Text(
                                      tr('garages'),
                                    ),
                                  ),
                                  NavigationRailDestination(
                                    icon: const Icon(
                                      Icons
                                          .business_outlined,
                                    ),
                                    label: Text(
                                      tr('company'),
                                    ),
                                  ),
                                ],
                              ),
                              const VerticalDivider(
                                width: 1,
                              ),
                              Expanded(child: body),
                            ],
                          )
                        : body,
                    bottomNavigationBar: wide
                        ? null
                        : NavigationBar(
                            selectedIndex:
                                _index > 4 ? 4 : _index,
                            onDestinationSelected:
                                (value) {
                              if (value < 4) {
                                setState(
                                  () => _index = value,
                                );
                              } else {
                                _showMoreSheet(
                                  context,
                                );
                              }
                            },
                            destinations: [
                              NavigationDestination(
                                icon: const Icon(
                                  Icons
                                      .dashboard_outlined,
                                ),
                                label:
                                    tr('dashboard'),
                              ),
                              NavigationDestination(
                                icon: const Icon(
                                  Icons
                                      .local_shipping_outlined,
                                ),
                                label:
                                    tr('vehicles'),
                              ),
                              NavigationDestination(
                                icon: const Icon(
                                  Icons.people_outline,
                                ),
                                label: tr('drivers'),
                              ),
                              NavigationDestination(
                                icon: const Icon(
                                  Icons
                                      .report_problem_outlined,
                                ),
                                label: tr('issues'),
                              ),
                              NavigationDestination(
                                icon: const Icon(
                                  Icons.more_horiz,
                                ),
                                label: tr('more'),
                              ),
                            ],
                          ),
                  );
                },
              );
            }

            void _showMoreSheet(
              BuildContext context,
            ) {
              showModalBottomSheet<void>(
                context: context,
                showDragHandle: true,
                builder: (context) => SafeArea(
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    children: [
                      ListTile(
                        leading: const Icon(
                          Icons.build_outlined,
                        ),
                        title:
                            Text(tr('repairs')),
                        onTap: () {
                          Navigator.pop(context);
                          setState(() => _index = 4);
                        },
                      ),
                      ListTile(
                        leading: const Icon(
                          Icons.garage_outlined,
                        ),
                        title:
                            Text(tr('garages')),
                        onTap: () {
                          Navigator.pop(context);
                          setState(() => _index = 5);
                        },
                      ),
                      ListTile(
                        leading: const Icon(
                          Icons.business_outlined,
                        ),
                        title:
                            Text(tr('company')),
                        subtitle: Text(
                          '${tr('team')} • ${tr('settings')}',
                        ),
                        onTap: () {
                          Navigator.pop(context);
                          setState(() => _index = 6);
                        },
                      ),
                    ],
                  ),
                ),
              );
            }
          }
          DART

      - name: Format and test
        run: |
          dart format lib
          flutter pub get
          flutter analyze --no-fatal-infos

      - name: Save commercial foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add lib

          git commit -m "FleetPilot commercial foundation" || true
          git push

      - name: Deploy commercial version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run deploy.yml --ref main
