name: Unified hardened Fleet Garage - Android and iPhone


on:
  pull_request:
    paths:
      - '.github/workflows/staging-single-session-qa.yml'
      - 'web/demo/session/**'
      - 'tools/export_private_qa.py'
      - 'tests/private_qa_export_test.py'
      - 'tests/single_session_browser_e2e.mjs'
      - 'tests/single_session_connected_browser_e2e.mjs'
      - 'tests/disposable_connected_fixture.mjs'
      - 'supabase/garage_staging/**'
      - 'supabase/migrations/001_fleetpilot.sql'
      - 'supabase/migrations/002_saas_foundation.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-connected-demo:
    name: Hardened real Fleet and Garage - Android Chrome and iPhone Safari emulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GARAGE_QA_DIR: /tmp/flotaryx-single-session-qa
      PLAYWRIGHT_BROWSERS_PATH: '0'
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned green security stack from PR 61 (no merge or deployment)
        uses: actions/checkout@v4
        with:
          repository: jdrynko-hue/FleetPilot
          ref: ee36ffbfaf14c2636e069174ac34523204058619
          path: .qa-security-source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Verify owner-private HTTPS export configuration
        run: python3 tests/private_qa_export_test.py
      - name: Install pinned disposable browser dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium webkit
      - name: Verify browser test syntax and local-only UI
        run: |
          node --check tests/disposable_connected_fixture.mjs
          node --check tests/single_session_connected_browser_e2e.mjs
          python3 - <<'PY'
          from pathlib import Path
          page=Path('web/demo/session/index.html').read_text()
          assert 'noindex,nofollow' in page
          assert "allowed(location.hostname)" in page
          assert "u.protocol==='http:'" in page
          assert 'stripe.com' not in page.lower()
          assert 'supabase.co' not in page.lower()
          assert '<meta name="robots"' in page
          assert '/session-config.js' in page
          assert '__FLOTARYX_SINGLE_SESSION_QA__' in page
          assert '__FLOTARYX_LOCAL_QA__' not in page
          assert "roles:{" not in page
          assert 'localStorage.setItem' not in page
          assert 'sessionStorage.setItem' not in page
          assert all('id="'+role+'"' in page for role in
              ('fleet','garage','mechanic','customer'))
          print('PASS fail-closed localhost-only interface')
          PY
      - name: Compose actual Fleet security stack and Garage in a fresh unlinked Supabase
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GARAGE_QA_DIR"
          cd "$GARAGE_QA_DIR"
          supabase init --yes
          mkdir -p supabase/migrations
          # Fleet foundation resets are confined to this fresh local stack.
          # No RepairBridge replacement Fleet tables or provisioning RPC.
          cp "$GITHUB_WORKSPACE/.qa-security-source/supabase/migrations/001_fleetpilot.sql" "supabase/migrations/20261015000001_001_fleetpilot.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/supabase/migrations/002_saas_foundation.sql" "supabase/migrations/20261015000002_002_saas_foundation.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/tests/qa_fleet_storage_local_tables.sql" "supabase/migrations/20261015000003_qa_fleet_storage_local_tables.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/supabase/qa_hardening/001_restrict_fleet_documents_checks_change_requests.sql" "supabase/migrations/20261015000004_001_restrict_fleet_documents_checks_change_requests.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/supabase/qa_hardening/002_private_fleet_storage.sql" "supabase/migrations/20261015000005_002_private_fleet_storage.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/supabase/qa_hardening/003_driver_membership_least_privilege.sql" "supabase/migrations/20261015000006_003_driver_membership_least_privilege.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/tests/qa_driver_rpc_local_schema.sql" "supabase/migrations/20261015000007_qa_driver_rpc_local_schema.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/supabase/qa_hardening/004_driver_read_rpcs.sql" "supabase/migrations/20261015000008_004_driver_read_rpcs.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/supabase/qa_hardening/005_driver_write_rpcs.sql" "supabase/migrations/20261015000009_005_driver_write_rpcs.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/supabase/qa_hardening/006_company_invites_membership_rpc.sql" "supabase/migrations/20261015000010_006_company_invites_membership_rpc.sql"
          cp "$GITHUB_WORKSPACE/.qa-security-source/supabase/qa_hardening/007_public_definer_acl_parity.sql" "supabase/migrations/20261015000011_007_public_definer_acl_parity.sql"
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/001_workshop_foundation.sql" "supabase/migrations/20261015000012_001_workshop_foundation.sql"
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/002_staff_invites_and_diagnosis.sql" "supabase/migrations/20261015000013_002_staff_invites_and_diagnosis.sql"
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/003_mechanic_assignment.sql" "supabase/migrations/20261015000014_003_mechanic_assignment.sql"
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/004_quote_revisions_and_approval.sql" "supabase/migrations/20261015000015_004_quote_revisions_and_approval.sql"
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/005_private_media_storage.sql" "supabase/migrations/20261015000016_005_private_media_storage.sql"
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/006_fleet_garage_repair_bridge.sql" "supabase/migrations/20261015000017_006_fleet_garage_repair_bridge.sql"
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/007_private_customer_bookings.sql" "supabase/migrations/20261015000018_007_private_customer_bookings.sql"
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/008_resource_calendar_notifications.sql" "supabase/migrations/20261015000019_008_resource_calendar_notifications.sql"
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/009_mechanic_roster_bay_assignment.sql" "supabase/migrations/20261015000020_009_mechanic_roster_bay_assignment.sql"
          sed -i 's/^enable_confirmations = true$/enable_confirmations = false/' supabase/config.toml
          grep -q '^enable_confirmations = false$' supabase/config.toml
      - name: Start local Supabase Auth and Data API
        shell: bash
        run: |
          cd "$GARAGE_QA_DIR"
          supabase start -x studio,analytics,imgproxy
      - name: Run connected browser acceptance with disposable staff identities
        shell: bash
        run: |
          set -euo pipefail
          cd "$GARAGE_QA_DIR"
          supabase status -o env > "$RUNNER_TEMP/connected_qa_environment"
          read_local() {
            sed -n "s/^$1=//p" "$RUNNER_TEMP/connected_qa_environment" | head -1 | tr -d '"'
          }
          export GARAGE_TEST_API_URL="$(read_local API_URL)"
          export GARAGE_TEST_ANON_KEY="$(read_local ANON_KEY)"
          export SINGLE_SESSION_API_URL="$GARAGE_TEST_API_URL"
          export SINGLE_SESSION_ANON_KEY="$GARAGE_TEST_ANON_KEY"
          test -n "$GARAGE_TEST_ANON_KEY"
          test -n "$GARAGE_TEST_API_URL"
          [[ "$GARAGE_TEST_API_URL" =~ ^http://(127\.0\.0\.1|localhost):[0-9]+$ ]]
          echo "::add-mask::$GARAGE_TEST_ANON_KEY"
          cd "$GITHUB_WORKSPACE"
          export UNIFIED_REAL_FLEET=1
          export SINGLE_SESSION_EXPECT_CONTEXT=1
          export LOCAL_ACL_API_URL="$GARAGE_TEST_API_URL"
          export LOCAL_ACL_ANON_KEY="$GARAGE_TEST_ANON_KEY"
          export LOCAL_INVITE_API_URL="$GARAGE_TEST_API_URL"
          export LOCAL_INVITE_ANON_KEY="$GARAGE_TEST_ANON_KEY"
          node .qa-security-source/tests/qa_definer_acl_local_e2e.mjs
          node .qa-security-source/tests/qa_company_invite_local_e2e.mjs
          node tests/single_session_browser_e2e.mjs
          node tests/single_session_connected_browser_e2e.mjs
      - name: Verify both Android and iPhone real connected screenshots
        shell: bash
        run: |
          set -euo pipefail
          for role in fleet garage mechanic customer; do
            test -s "artifacts/single-session-connected/${role}.png"
            test -s "artifacts/single-session-connected/android/${role}.png"
          done
      - name: Upload Android and iPhone screens using synthetic accounts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flotaryx-unified-android-iphone
          path: artifacts/single-session-connected/**/*.png
          retention-days: 7
          if-no-files-found: warn
      - name: Destroy ephemeral Supabase containers and discard state
        if: always()
        shell: bash
        run: |
          if [[ -d "$GARAGE_QA_DIR/supabase" ]]; then
            cd "$GARAGE_QA_DIR"
            supabase stop --no-backup || true
          fi
