      - name: Analyze, test and build Flutter Web
        shell: bash
        run: |
          flutter pub get
          dart format lib/company/manager_control_panel.dart lib/shell/fleet_shell.dart
          flutter analyze --no-fatal-infos
          flutter test
          flutter create --platforms=web --project-name fleetpilot .
          flutter build web --release --base-href "/FleetPilot/"

      - name: Commit manager panel after successful verification
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/company/manager_control_panel.dart lib/shell/fleet_shell.dart
          if git diff --cached --quiet; then
            echo 'Manager panel is already installed'
          else
            git commit -m 'Add manager control panel with safe van assignments and repair shortcuts'
            git push
          fi

      - name: Deploy latest FleetPilot site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run deploy.yml --ref main
