name: QA Definer ACL production parity — isolated Auth and PostgREST

on:
  pull_request:
    paths:
      - 'supabase/qa_hardening/007_public_definer_acl_parity.sql'
      - 'tests/qa_definer_acl_local_e2e.mjs'
      - 'tests/qa_definer_acl_guards.py'
      - 'supabase/qa_hardening/preflight/02_definer_acl_catalog.sql'
      - '.github/workflows/qa-definer-acl-parity.yml'
      - 'supabase/qa_hardening/*.sql'
      - 'supabase/migrations/001_fleetpilot.sql'
      - 'supabase/migrations/002_saas_foundation.sql'
      - 'tests/qa_fleet_storage_local_tables.sql'
      - 'tests/qa_driver_rpc_local_schema.sql'
      - 'tests/qa_company_invite_local_e2e.mjs'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-acl-guard-only
          POSTGRES_DB: disposable_acl_guards
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d disposable_acl_guards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: disposable-acl-guard-only
      PGDATABASE: disposable_acl_guards
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client when needed
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
      - name: Verify schema drift rejection and atomic rollback on disposable databases
        run: python3 tests/qa_definer_acl_guards.py
  definer-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOCAL_ACL_DIR: /tmp/flotaryx-local-definer-acl
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax before any containers
        run: node --check tests/qa_definer_acl_local_e2e.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Build fully disposable synthetic QA migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOCAL_ACL_DIR"
          cd "$LOCAL_ACL_DIR"
          supabase init --yes
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/supabase/migrations/001_fleetpilot.sql" supabase/migrations/20261014000100_fleet.sql
          cp "$GITHUB_WORKSPACE/supabase/migrations/002_saas_foundation.sql" supabase/migrations/20261014000200_saas.sql
          cp "$GITHUB_WORKSPACE/tests/qa_fleet_storage_local_tables.sql" supabase/migrations/20261014000300_qa_tables.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/001_restrict_fleet_documents_checks_change_requests.sql" supabase/migrations/20261014000400_tenant_rls.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/003_driver_membership_least_privilege.sql" supabase/migrations/20261014000500_driver_firewall.sql
          cp "$GITHUB_WORKSPACE/tests/qa_driver_rpc_local_schema.sql" supabase/migrations/20261014000600_check_triggers.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/004_driver_read_rpcs.sql" supabase/migrations/20261014000700_driver_read.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/005_driver_write_rpcs.sql" supabase/migrations/20261014000800_driver_write.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/006_company_invites_membership_rpc.sql" supabase/migrations/20261014000900_invites.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/007_public_definer_acl_parity.sql" supabase/migrations/20261014001000_definer_acl.sql
          sed -i 's/^enable_confirmations = true$/enable_confirmations = false/' supabase/config.toml
          grep -q '^enable_confirmations = false$' supabase/config.toml
      - name: Start local-only Auth, PostgREST, and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          cd "$LOCAL_ACL_DIR"
          supabase start -x studio,analytics,imgproxy
      - name: Test anonymous denial and trigger functionality
        shell: bash
        run: |
          set -euo pipefail
          cd "$LOCAL_ACL_DIR"
          supabase status -o env > "$RUNNER_TEMP/qa_acl_env"
          local_value() {
            sed -n "s/^$1=//p" "$RUNNER_TEMP/qa_acl_env" | head -1 | tr -d '"'
          }
          export LOCAL_ACL_API_URL="$(local_value API_URL)"
          export LOCAL_ACL_ANON_KEY="$(local_value ANON_KEY)"
          if [[ -z "$LOCAL_ACL_ANON_KEY" ]] || \
             [[ ! "$LOCAL_ACL_API_URL" =~ ^http://(127\.0\.0\.1|localhost):[0-9]+$ ]]; then
            echo 'Refusing non-local Supabase environment' >&2
            exit 1
          fi
          echo "::add-mask::$LOCAL_ACL_ANON_KEY"
          export LOCAL_INVITE_API_URL="$LOCAL_ACL_API_URL"
          export LOCAL_INVITE_ANON_KEY="$LOCAL_ACL_ANON_KEY"
          node "$GITHUB_WORKSPACE/tests/qa_definer_acl_local_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/qa_company_invite_local_e2e.mjs"
      - name: Remove disposable Supabase without backup
        if: always()
        shell: bash
        run: |
          if [[ -d "$LOCAL_ACL_DIR/supabase" ]]; then
            cd "$LOCAL_ACL_DIR"
            supabase stop --no-backup || true
          fi
