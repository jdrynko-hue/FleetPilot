              raise SystemExit('Legal archive checksum mismatch')
          with zipfile.ZipFile(io.BytesIO(archive_bytes)) as z:
              names=z.namelist()
              legal=[x for x in names if x.startswith('web/legal/') and x.endswith('/index.html')]
              if len(legal)!=48:
                  raise SystemExit('Expected 48 translated legal documents')
              for lang in ['en','pl','de','sk','cs','hu','ro','es','fr','it','uk','pt']:
                  for doc in ['terms','privacy','cookies','dpa']:
                      if f'web/legal/{lang}/{doc}/index.html' not in names:
                          raise SystemExit('Missing translation '+lang+' '+doc)
              for name in names:
                  dest=pathlib.PurePosixPath(name)
                  if dest.is_absolute() or '..' in dest.parts:
                      raise SystemExit('Invalid archive path')
                  if name.startswith('web/') and name.endswith('/index.html'):
                      file=pathlib.Path(name)
                      file.parent.mkdir(parents=True,exist_ok=True)
                      file.write_bytes(z.read(name))
              anchors=z.read('_footer_links.txt').decode('utf-8')
              company=z.read('_footer_company.txt').decode('utf-8')
              style=z.read('_footer_style.txt').decode('utf-8')
          markup=original.read_text(encoding='utf-8')
          if markup.count('<div class="foot-links">') != 1 or markup.count('</footer>') != 1 or markup.count('</head>') != 1:
              raise SystemExit('Unexpected homepage structure; refusing to replace')
          markup, replacements = re.subn(r'(<div class="foot-links">)(.*?)(</div>)',
              lambda m:m.group(1)+m.group(2)+anchors+m.group(3), markup, count=1, flags=re.S)
          if replacements != 1:
              raise SystemExit('Failed to integrate legal links')
          markup=markup.replace('</footer>',company+'</footer>',1).replace('</head>',style+'</head>',1)
          if not all(h in markup for h in ['/terms/','/privacy/','/cookies/','/dpa/']):
              raise SystemExit('Homepage footer links not complete')
          original.write_text(markup,encoding='utf-8')
          print('Validated 48 complete translations in 12 languages, 4 pages each. Live billing untouched.')
          PY_RESTORE
      - name: Validate published page structure and encoding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_VERIFY'
          from pathlib import Path
          from html.parser import HTMLParser
          class HTMLCheck(HTMLParser):
            def __init__(self): super().__init__();self.sections=0
            def handle_starttag(self,tag,attrs):
              if tag=='section': self.sections+=1
