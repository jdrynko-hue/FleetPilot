      - name: Verify content and navigation
        shell: bash
        run: |
          python3 - <<'PY_CHECK'
          from html.parser import HTMLParser
          from pathlib import Path

          page = Path('web/start/index.html')
          content = page.read_text(encoding='utf-8')

          class Check(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.links = set()
                  self.translations = 0
              def handle_starttag(self, tag, attrs):
                  a = dict(attrs)
                  if 'id' in a:
                      self.ids.add(a['id'])
                  if 'href' in a:
                      self.links.add(a['href'])
                  if 'data-en' in a or 'data-pl' in a:
                      assert 'data-en' in a and 'data-pl' in a, 'Incomplete translation'
                      self.translations += 1

          check = Check()
          check.feed(content)
          assert check.translations >= 90, 'Translation content missing'
          assert {'industries','features','how','roles','faq'} <= check.ids, 'Section missing'
          assert '../' in check.links and '../install/' in check.links, 'Portal/install link missing'
          assert 'FleetPilot' in content and 'Taxis' in content and 'haulage' in content
          print('FleetPilot page verified:', len(content), 'characters,', check.translations, 'translated elements')
          PY_CHECK

      - name: Commit product website
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/start/index.html
          if git diff --cached --quiet; then
            echo 'Website already up to date.'
          else
            git commit -m 'Broaden FleetPilot product site for all fleet types'
            git push origin HEAD:main
          fi

      - name: Redeploy website and FleetPilot portal
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run deploy.yml --ref main
