name: QA public API smoke - offline guards only

on:
  pull_request:
    paths:
      - 'tools/qa_public_api_smoke.py'
      - 'tools/test_qa_public_api_smoke.py'
      - '.github/workflows/qa-public-api-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'tools/qa_public_api_smoke.py'
      - 'tools/test_qa_public_api_smoke.py'
      - '.github/workflows/qa-public-api-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-guards:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify QA target, privacy and authorization-result guards
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tools -p test_qa_public_api_smoke.py -v
