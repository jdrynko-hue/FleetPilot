name: Recover public production snapshot without deployment

on:
  pull_request:
    paths:
      - 'tools/recover_marketing_baseline.py'
      - 'tests/recovery_snapshot_test.py'
      - 'docs/releases/2026-10-17-production-inventory.json'
      - '.github/workflows/recover-production-snapshot.yml'

permissions:
  contents: read

jobs:
  recover-public-files:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: fd25fa292127d49d43b49e7feab1f6ed0b237fe8
          path: deployed-source
          persist-credentials: false
      - name: Verify bounded read-only recovery
        run: python3 -B tests/recovery_snapshot_test.py -v
      - name: Capture the exact published file inventory twice
        run: >-
          python3 -B tools/recover_marketing_baseline.py
          --inventory docs/releases/2026-10-17-production-inventory.json
          --deployed-source deployed-source
          --output recovered-production
      - name: Retain capture and diagnostics for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-snapshot-read-only
          path: recovered-production
          retention-days: 30
          include-hidden-files: true
          if-no-files-found: error
