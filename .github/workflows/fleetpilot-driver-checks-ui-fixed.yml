name: FleetPilot Driver Checks UI Fixed

on:
  push:
    paths:
      - ".github/workflows/fleetpilot-driver-checks-ui-fixed.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  driver_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install driver walkaround checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import json
          
          files = {'lib/checks/check_logic.dart': '', 'lib/checks/vehicle_checks_screen.dart': '', 'test/check_logic_test.dart': ''}
          for name, encoded in files.items():
              dest = Path(name)
              assert not dest.exists(), f'Existing check screen would be overwritten: {name}'
              dest.parent.mkdir(parents=True, exist_ok=True)
              dest.write_bytes(base64.b64decode(encoded))
          
          # The only existing page modified is the vehicle details screen.
          vehicle_file = Path('lib/vehicles/vehicle_detail_screen.dart')
          s = vehicle_file.read_text(encoding='utf-8')
          import_anchor = "import '../documents/vehicle_documents_screen.dart';"
          assert s.count(import_anchor) == 1, 'Vehicle detail import anchor changed'
          s = s.replace(import_anchor, "import '../checks/vehicle_checks_screen.dart';\n".replace('\n','\n') + import_anchor, 1)
          # Avoid a literal backslash-n in generated Dart.
          s = s.replace("import '../checks/vehicle_checks_screen.dart';\n", "import '../checks/vehicle_checks_screen.dart';" + chr(10))
          anchor = "                Card(\n                  child: ListTile(\n                    leading: const Icon(Icons.folder_copy_outlined),"
          anchor = anchor.replace('\n', chr(10))
          assert s.count(anchor) == 1, 'Vehicle documents placement changed'
          addition = """                Card(
                            child: ListTile(
                              leading: const Icon(Icons.fact_check_outlined),
                              title: Text(tr('walkaround_checks')),
                              subtitle: Text(tr('walkaround_checks_subtitle')),
                              trailing: const Icon(Icons.chevron_right),
                              onTap: () async {
                                final changed = await Navigator.push<bool>(
                                  context,
                                  MaterialPageRoute(
                                    builder: (_) => VehicleChecksScreen(
                                      company: widget.company,
                                      vehicle: vehicle,
                                      canManage: widget.canManage,
                                    ),
                                  ),
                                );
                                if (changed == true) await _refresh();
                              },
                            ),
                          ),
                          const SizedBox(height: 12),
          """
          assert addition.count('VehicleChecksScreen') == 1
          s = s.replace(anchor, addition + anchor, 1)
          vehicle_file.write_text(s, encoding='utf-8')
          
          translations = {'walkaround_checks': {'pl': 'Kontrola pojazdu', 'en': 'Vehicle checks', 'de': 'Fahrzeugkontrolle', 'sk': 'Kontrola vozidla', 'cs': 'Kontrola vozidla', 'hu': 'Járműellenőrzés', 'ro': 'Verificarea vehiculului', 'es': 'Inspección del vehículo', 'fr': 'Contrôle du véhicule', 'it': 'Controllo veicolo', 'uk': 'Перевірка автомобіля', 'pt': 'Inspeção do veículo'}, 'walkaround_checks_subtitle': {'pl': 'Kontrola przed i po trasie, zgłaszanie usterek', 'en': 'Pre-trip and post-trip checks, defect reporting', 'de': 'Kontrollen vor und nach der Fahrt, Mängel melden', 'sk': 'Kontroly pred a po jazde, hlásenie závad', 'cs': 'Kontroly před a po jízdě, hlášení závad', 'hu': 'Indulás előtti és utáni ellenőrzés, hibajelzés', 'ro': 'Verificări înainte și după cursă, raportare defecțiuni', 'es': 'Revisiones antes y después del viaje, incidencias', 'fr': 'Contrôles avant et après trajet, défauts', 'it': 'Controlli prima e dopo il viaggio, guasti', 'uk': 'Перевірки до та після поїздки, повідомлення про несправності', 'pt': 'Verificações antes e depois da viagem, avarias'}, 'check_intro': {'pl': 'Sprawdź każdy punkt przed zapisaniem kontroli.', 'en': 'Inspect every item before submitting the check.', 'de': 'Vor dem Speichern jeden Punkt überprüfen.', 'sk': 'Pred uložením skontrolujte každý bod.', 'cs': 'Před uložením zkontrolujte každý bod.', 'hu': 'Mentés előtt ellenőrizzen minden pontot.', 'ro': 'Verificați fiecare punct înainte de trimitere.', 'es': 'Comprueba cada punto antes de enviar.', 'fr': 'Vérifiez chaque point avant de valider.', 'it': 'Controlla ogni voce prima di inviare.', 'uk': 'Перевірте всі пункти перед збереженням.', 'pt': 'Verifique todos os itens antes de enviar.'}, 'check_plan_unavailable': {'pl': 'Kontrole kierowców wymagają aktywnego okresu próbnego lub planu Pro/Business.', 'en': 'Driver checks require an active trial or Pro/Business plan.', 'de': 'Fahrerkontrollen erfordern eine aktive Testphase oder Pro/Business.', 'sk': 'Kontroly vodičov