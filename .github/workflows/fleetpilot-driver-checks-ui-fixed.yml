          s = localization_file.read_text(encoding='utf-8')
          for lang in ['pl', 'en', 'de', 'sk', 'cs', 'hu', 'ro', 'es', 'fr', 'it', 'uk', 'pt']:
              anchor = '  "' + lang + '": <String, String>{' + chr(10)
              assert s.count(anchor) == 1, 'Localization block missing for ' + lang
              rows = ''.join('    ' + json.dumps(key, ensure_ascii=False) + ': '
                             + json.dumps(values[lang], ensure_ascii=False) + ',' + chr(10)
                             for key, values in translations.items())
              s = s.replace(anchor, anchor + rows, 1)
          localization_file.write_text(s, encoding='utf-8')
          print('Driver checks screen and 12-language strings installed')
          PY
      - name: Verify Flutter code and tests
        run: |
          flutter pub get
          dart format lib/checks lib/vehicles/vehicle_detail_screen.dart lib/core/localization.dart test/check_logic_test.dart
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit validated code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/checks lib/vehicles/vehicle_detail_screen.dart lib/core/localization.dart test/check_logic_test.dart
          git commit -m "Add secure daily driver vehicle inspections"
          git push
      - name: Deploy updated FleetPilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
