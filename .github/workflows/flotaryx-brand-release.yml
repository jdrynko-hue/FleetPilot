name: Flotaryx - Complete Brand Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flotaryx-brand-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flotaryx-brand-setup
  cancel-in-progress: false

jobs:
  prepare-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create web scaffolding for release checks
        run: flutter create --platforms=web --project-name fleetpilot .

