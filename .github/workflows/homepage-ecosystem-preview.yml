name: Flotaryx landing ecosystem preview checks

on:
  pull_request:
    paths:
      - 'web/start/index.html'
      - 'web/index.html'
      - 'tests/homepage_fleet_garage_preview_test.py'
      - '.github/workflows/homepage-ecosystem-preview.yml'
  push:
    branches:
      - 'feat/homepage-fleet-garage-ecosystem-preview-20261014'
    paths:
      - 'web/start/index.html'
      - 'web/index.html'
      - 'tests/homepage_fleet_garage_preview_test.py'
      - '.github/workflows/homepage-ecosystem-preview.yml'

permissions:
  contents: read

jobs:
  static-homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify website copy, languages, safe availability claims and mobile layout
        run: python3 -m unittest discover -s tests -p homepage_fleet_garage_preview_test.py -v
