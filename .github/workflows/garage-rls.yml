name: Garage isolation and local Supabase E2E

on:
  pull_request:
    paths:
      - 'lib/garage/repair_bridge_repository.dart'
      - 'lib/garage/repair_requests_screen.dart'
      - 'lib/garage/order_actions_repository.dart'
      - 'supabase/garage_staging/**'
      - 'tests/garage_rls_isolation.sql'
      - 'tests/garage_invites_diagnosis.sql'
      - 'tests/garage_assignment_rls.sql'
      - 'tests/garage_quote_approval_rls.sql'
      - 'tests/garage_repairbridge_rls.sql'
      - 'tests/repairbridge_fleet_fixture.sql'
      - 'tests/garage_repairbridge_e2e.mjs'
      - 'tests/garage_consumer_bookings_rls.sql'
      - 'tests/garage_booking_incremental_upgrade.sql'
      - 'tests/garage_consumer_bookings_e2e.mjs'
      - 'tests/garage_resource_calendar_rls.sql'
      - 'tests/garage_resource_calendar_e2e.mjs'
      - 'tests/garage_mechanic_roster_rls.sql'
      - 'tests/garage_mechanic_roster_e2e.mjs'
      - 'tests/flotaryx_unified_ecosystem_e2e.mjs'
      - 'tests/garage_local_supabase_e2e.mjs'
      - 'tests/garage_storage_operation_compat.sql'
      - 'tests/garage_api_catalog_test.py'
      - 'supabase/qa_hardening/preflight/03_garage_api_catalog.sql'
      - '.github/workflows/garage-rls.yml'
      - 'server/garage-billing/test_operation_access.sql'
      - 'tests/garage_operation_access_e2e.mjs'
  push:
    branches: [main]
    paths:
      - 'supabase/garage_staging/**'
      - 'tests/garage_rls_isolation.sql'
      - 'tests/garage_invites_diagnosis.sql'
      - 'tests/garage_assignment_rls.sql'
      - 'tests/garage_quote_approval_rls.sql'
      - 'tests/garage_repairbridge_rls.sql'
      - 'tests/repairbridge_fleet_fixture.sql'
      - 'tests/garage_repairbridge_e2e.mjs'
      - 'tests/garage_consumer_bookings_rls.sql'
      - 'tests/garage_booking_incremental_upgrade.sql'
      - 'tests/garage_consumer_bookings_e2e.mjs'
      - 'tests/garage_resource_calendar_rls.sql'
      - 'tests/garage_resource_calendar_e2e.mjs'
      - 'tests/garage_mechanic_roster_rls.sql'
      - 'tests/garage_mechanic_roster_e2e.mjs'
      - 'tests/flotaryx_unified_ecosystem_e2e.mjs'
      - 'tests/garage_local_supabase_e2e.mjs'
      - 'tests/garage_storage_operation_compat.sql'
      - 'tests/garage_api_catalog_test.py'
      - 'supabase/qa_hardening/preflight/03_garage_api_catalog.sql'
      - '.github/workflows/garage-rls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garage-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        suite: [isolation, incremental-upgrade]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: temporary-garage-qa-only
          POSTGRES_DB: garage_qa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d garage_qa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: temporary-garage-qa-only
    steps:
      - uses: actions/checkout@v4
      - name: Use PostgreSQL client
        shell: bash
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Test Garage tenant boundaries in disposable PostgreSQL
        if: matrix.suite == 'isolation'
        shell: bash
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d garage_qa \
            -v ON_ERROR_STOP=1 \
            -f tests/garage_rls_isolation.sql \
            -f tests/garage_invites_diagnosis.sql \
            -f tests/garage_assignment_rls.sql \
            -f tests/garage_quote_approval_rls.sql \
            -f tests/garage_repairbridge_rls.sql \
            -f tests/garage_consumer_bookings_rls.sql \
            -f tests/garage_resource_calendar_rls.sql \
            -f tests/garage_mechanic_roster_rls.sql
      - name: Verify read-only Garage API metadata and deliberate drift
        if: matrix.suite == 'isolation'
        env:
          GARAGE_API_CATALOG_DISPOSABLE: '1'
        run: python3 tests/garage_api_catalog_test.py -v
      - name: Rehearse booking upgrade with existing data
        if: matrix.suite == 'incremental-upgrade'
        shell: bash
        run: |
          psql -h 127.0.0.1 -p 5432 -U postgres -d garage_qa \
            -v ON_ERROR_STOP=1 -f tests/garage_booking_incremental_upgrade.sql

  garage-supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GARAGE_QA_DIR: /tmp/flotaryx-garage-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Prepare throwaway local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GARAGE_QA_DIR"
          cd "$GARAGE_QA_DIR"
          supabase init --yes
          # Never use repository Fleet migrations, links or credentials.
          # Copy ONLY the additive Garage staging schema in order.
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/001_workshop_foundation.sql" \
            supabase/migrations/20261014000100_garage_workshops.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/002_staff_invites_and_diagnosis.sql" \
            supabase/migrations/20261014000200_garage_invites.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/003_mechanic_assignment.sql" \
            supabase/migrations/20261014000300_garage_assignments.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/004_quote_revisions_and_approval.sql" \
            supabase/migrations/20261014000400_garage_quotes.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/005_private_media_storage.sql" \
            supabase/migrations/20261014000500_garage_private_media.sql
          # RepairBridge requires a minimal Fleet schema. This fixture exists ONLY
          # inside disposable CI containers. Never copy the fixture to hosting.
          cp "$GITHUB_WORKSPACE/tests/repairbridge_fleet_fixture.sql" \
            supabase/migrations/20261014000590_local_fleet_fixture.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/006_fleet_garage_repair_bridge.sql" \
            supabase/migrations/20261014000600_repairbridge.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/007_private_customer_bookings.sql" \
            supabase/migrations/20261014000700_consumer_bookings.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/008_resource_calendar_notifications.sql" \
            supabase/migrations/20261014000800_resource_calendar_notifications.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/009_mechanic_roster_bay_assignment.sql" \
            supabase/migrations/20261014000900_mechanic_roster_assignment.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/010_storage_authenticated_info_compat.sql" supabase/migrations/20261015000021_storage_info_compat.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/011_booking_request_replay.sql" supabase/migrations/20261016000011_booking_request_replay.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/012_booking_cancellation_replay.sql" supabase/migrations/20261016000012_booking_cancellation_replay.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/013_booking_durable_request_keys.sql" supabase/migrations/20261016000013_booking_durable_request_keys.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/014_booking_confirmation_replay.sql" supabase/migrations/20261016000014_booking_confirmation_replay.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/015_booking_profile_owner_read.sql" supabase/migrations/20261016000015_booking_profile_owner_read.sql
          # GoTrue signup on loopback must issue a session without contacting
          # external email providers. Never change this in hosted production.
          sed -i 's/^enable_confirmations = true$/enable_confirmations = false/' \
            supabase/config.toml
          if ! grep -q '^enable_confirmations = false$' supabase/config.toml; then
            echo 'Local Auth confirmation setting not found' >&2
            exit 1
          fi
      - name: Start local Auth, PostgREST and Postgres
        shell: bash
        run: |
          set -euo pipefail
          cd "$GARAGE_QA_DIR"
          supabase start -x studio,analytics,imgproxy
      - name: Exercise signups, tenant RLS, invites and assignment APIs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GARAGE_QA_DIR"
          supabase status -o env > "$RUNNER_TEMP/garage_supabase_env"
          get_local_setting() {
            sed -n "s/^$1=//p" "$RUNNER_TEMP/garage_supabase_env" | head -1 | tr -d '"'
          }
          export GARAGE_TEST_API_URL="$(get_local_setting API_URL)"
          export GARAGE_TEST_ANON_KEY="$(get_local_setting ANON_KEY)"
          if [[ -z "$GARAGE_TEST_API_URL" || -z "$GARAGE_TEST_ANON_KEY" ]]; then
            echo 'Missing local Supabase API URL or anon key' >&2
            exit 1
          fi
          echo "::add-mask::$GARAGE_TEST_ANON_KEY"
          node "$GITHUB_WORKSPACE/tests/garage_local_supabase_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/garage_repairbridge_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/garage_consumer_bookings_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/garage_resource_calendar_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/garage_mechanic_roster_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/flotaryx_unified_ecosystem_e2e.mjs"
          qa_db_url="$(get_local_setting DB_URL)"
          echo "::add-mask::$qa_db_url"
          psql "$qa_db_url" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/tests/garage_storage_operation_compat.sql"
      - name: Verify billing operation denials through genuine Auth and Storage
        shell: bash
        run: |
          set -euo pipefail
          get_local_setting() {
            sed -n "s/^$1=//p" "$RUNNER_TEMP/garage_supabase_env" | head -1 | tr -d '"'
          }
          export GARAGE_TEST_API_URL="$(get_local_setting API_URL)"
          export GARAGE_TEST_ANON_KEY="$(get_local_setting ANON_KEY)"
          export GARAGE_OPERATION_DB_URL="$(get_local_setting DB_URL)"
          export GARAGE_OPERATION_DISPOSABLE=1
          echo "::add-mask::$GARAGE_OPERATION_DB_URL"
          psql "$GARAGE_OPERATION_DB_URL" -v ON_ERROR_STOP=1 \
            -f server/garage-billing/test_trial_ledger.sql \
            -f server/garage-billing/test_paid_lifecycle.sql \
            -f server/garage-billing/test_operation_access.sql
          node tests/garage_operation_access_e2e.mjs
      - name: Stop isolated Supabase services
        if: always()
        shell: bash
        run: |
          if [[ -d "$GARAGE_QA_DIR/supabase" ]]; then
            cd "$GARAGE_QA_DIR"
            supabase stop --no-backup || true
          fi
