          billing = Path('lib/company/billing_screen.dart')
          billing.write_bytes(base64.b64decode(''.join(encoded.split())))

          screen = Path('lib/company/company_screen.dart')
          source = screen.read_text(encoding='utf-8')
          needed_import = "import 'billing_screen.dart';\n"
          if needed_import not in source:
              anchor = "import '../data/models.dart';\n"
              assert source.count(anchor) == 1, 'CompanyScreen import anchor changed'
              source = source.replace(anchor, anchor + needed_import, 1)

          marker = "        Text(tr('company'), style: Theme.of(context).textTheme.headlineMedium),\n"
          assert source.count(marker) == 1, 'CompanyScreen title anchor changed'
          if "BillingScreen(company: widget.company)" not in source:
              addition = """
                  if (_canAdmin)
                    Card(
                      child: ListTile(
                        leading: const Icon(Icons.credit_card_outlined),
                        title: Text(AppLocale.language.value == 'pl'
                            ? 'Abonament i płatności' : 'Subscription and billing'),
                        subtitle: Text(AppLocale.language.value == 'pl'
                            ? 'Wybierz plan i otwórz płatność testową'
                            : 'Choose a plan and test Stripe Checkout'),
                        trailing: const Icon(Icons.chevron_right),
                        onTap: () => Navigator.of(context).push(
                          MaterialPageRoute<void>(
                            builder: (_) => BillingScreen(company: widget.company),
                          ),
                        ),
                      ),
                    ),
          
          """
              source = source.replace(marker, marker + addition, 1)
          screen.write_text(source, encoding='utf-8')
          print('Billing UI written, CompanyScreen linked, no secret keys touched')
          PYCODE

      - name: Analyze and test Flutter
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=web --project-name fleetpilot .
          flutter pub get
          dart format lib/company/billing_screen.dart lib/company/company_screen.dart
          flutter analyze --no-fatal-infos
          flutter test

      - name: Commit billing screen (triggers normal deploy)
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/company/billing_screen.dart lib/company/company_screen.dart
          if git diff --cached --quiet; then
            echo 'Already installed.'
          else
            git commit -m 'Add Flotaryx sandbox subscription billing UI'
            git push origin HEAD:main
          fi
