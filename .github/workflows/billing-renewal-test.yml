name: Billing renewal regression tests
on:
  push:
    branches: [main, fix/billing-renewal-refresh]
    paths: ['lib/company/billing_screen.dart', 'test/billing_renewal_test.dart', 'pubspec.*', '.github/workflows/billing-renewal-test.yml']
  pull_request:
    paths: ['lib/company/billing_screen.dart', 'test/billing_renewal_test.dart', 'pubspec.*', '.github/workflows/billing-renewal-test.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/company/billing_screen.dart test/billing_renewal_test.dart
      - run: flutter analyze lib/company/billing_screen.dart test/billing_renewal_test.dart --no-fatal-infos
      - run: flutter test test/billing_renewal_test.dart
