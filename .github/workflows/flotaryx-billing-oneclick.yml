name: Flotaryx Billing — One File Install

on:
  workflow_dispatch:

# Archived installer; no repository writes or Pages publishing allowed.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  install:
    # Disabled: legacy workflow bypassed the reviewed manual release path.
    # Re-activation requires its own reviewed PR and explicit owner approval.
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify one-time Supabase secret exists
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo 'Missing SUPABASE_ACCESS_TOKEN. Add it under GitHub repository Settings > Secrets and variables > Actions.'
            exit 1
          fi
      - name: Restore release files from this installer (integrity checked)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_RESTORE'
          import base64, hashlib, io, subprocess, zipfile
          from pathlib import Path
