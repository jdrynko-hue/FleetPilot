      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked billing API tests
        shell: bash
        run: |
          set -euo pipefail
          npm exec --yes --package typescript@5.9.3 -- tsc --target es2022 --lib es2022,dom --skipLibCheck --outDir /tmp/flotaryx-compiled tests/deno-test-globals.d.ts supabase/functions/flotaryx-billing-manage/index.ts
          cp /tmp/flotaryx-compiled/index.js tests/billing-manage.compiled.mjs
          node tests/billing-manage.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and compile Flutter web app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=web --project-name fleetpilot .
          flutter pub get
          dart format lib/company/billing_screen.dart
          flutter analyze --no-fatal-infos
          flutter build web --release --base-href '/' \
            --dart-define=SUPABASE_URL=https://wqhymmtiawfwjikdaujo.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_j638npcsGiRpQqYbVoz1Rg_qo4vA6tt
          test -s build/web/main.dart.js
          test -s build/web/app/index.html
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy protected Supabase billing API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy flotaryx-billing-manage \
            --project-ref wqhymmtiawfwjikdaujo
      - name: Commit validated release sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/company/billing_screen.dart supabase/functions/flotaryx-billing-manage/index.ts tests/billing-manage.test.mjs tests/billing-manage.compiled.mjs tests/deno-test-globals.d.ts tests/README.md
          if ! git diff --cached --quiet; then
            git commit -m 'Install Flotaryx subscription management and invoice history'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - name: Publish updated Flotaryx web application
        id: deploy
        uses: actions/deploy-pages@v4
