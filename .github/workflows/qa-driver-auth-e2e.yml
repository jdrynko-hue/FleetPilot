name: QA Driver RPC - real local Auth and PostgREST E2E

on:
  pull_request:
    paths:
      - '.github/workflows/qa-driver-auth-e2e.yml'
      - 'tests/qa_driver_local_auth_e2e.mjs'
      - 'tests/qa_driver_rpc_local_schema.sql'
      - 'tests/qa_fleet_storage_local_tables.sql'
      - 'supabase/qa_hardening/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-local-api:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LOCAL_DRIVER_DIR: /tmp/flotaryx-driver-auth-e2e
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax before any Docker startup
        run: node --check tests/qa_driver_local_auth_e2e.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Construct isolated disposable QA migrations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$LOCAL_DRIVER_DIR"
          cd "$LOCAL_DRIVER_DIR"
          supabase init --yes
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/supabase/migrations/001_fleetpilot.sql" supabase/migrations/20261014000100_fleet.sql
          cp "$GITHUB_WORKSPACE/supabase/migrations/002_saas_foundation.sql" supabase/migrations/20261014000200_saas.sql
          cp "$GITHUB_WORKSPACE/tests/qa_fleet_storage_local_tables.sql" supabase/migrations/20261014000300_qa_tables.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/001_restrict_fleet_documents_checks_change_requests.sql" supabase/migrations/20261014000400_tenant_rls.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/003_driver_membership_least_privilege.sql" supabase/migrations/20261014000500_driver_firewall.sql
          cp "$GITHUB_WORKSPACE/tests/qa_driver_rpc_local_schema.sql" supabase/migrations/20261014000600_qa_check_triggers.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/004_driver_read_rpcs.sql" supabase/migrations/20261014000700_driver_read.sql
          cp "$GITHUB_WORKSPACE/supabase/qa_hardening/005_driver_write_rpcs.sql" supabase/migrations/20261014000800_driver_write.sql
          sed -i 's/^enable_confirmations = true$/enable_confirmations = false/' supabase/config.toml
          grep -q '^enable_confirmations = false$' supabase/config.toml
      - name: Start disposable Supabase Auth, REST and PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          cd "$LOCAL_DRIVER_DIR"
          supabase start -x studio,analytics,imgproxy
      - name: Test six synthetic account identities using signed JWTs
        shell: bash
        run: |
          set -euo pipefail
          cd "$LOCAL_DRIVER_DIR"
          supabase status -o env > "$RUNNER_TEMP/qa_driver_auth_env"
          local_value() {
            sed -n "s/^$1=//p" "$RUNNER_TEMP/qa_driver_auth_env" | head -1 | tr -d '"'
          }
          export LOCAL_DRIVER_API_URL="$(local_value API_URL)"
          export LOCAL_DRIVER_ANON_KEY="$(local_value ANON_KEY)"
          if [[ -z "$LOCAL_DRIVER_ANON_KEY" ]] || \
             [[ ! "$LOCAL_DRIVER_API_URL" =~ ^http://(127\.0\.0\.1|localhost):[0-9]+$ ]]; then
            echo 'Refusing any hosted or non-local Supabase destination' >&2
            exit 1
          fi
          echo "::add-mask::$LOCAL_DRIVER_ANON_KEY"
          node "$GITHUB_WORKSPACE/tests/qa_driver_local_auth_e2e.mjs"
      - name: Discard the entire local project
        if: always()
        shell: bash
        run: |
          if [[ -d "$LOCAL_DRIVER_DIR/supabase" ]]; then
            cd "$LOCAL_DRIVER_DIR"
            supabase stop --no-backup || true
          fi
