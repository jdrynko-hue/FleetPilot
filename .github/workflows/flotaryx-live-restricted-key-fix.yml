name: Flotaryx Live Restricted Key Fix

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flotaryx-live-restricted-key-fix
  cancel-in-progress: false

jobs:
  fix-live-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: wqhymmtiawfwjikdaujo
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Download deployed Live functions
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo 'Missing SUPABASE_ACCESS_TOKEN GitHub secret'
            exit 1
          fi
          for fn in flotaryx-live-create-checkout flotaryx-live-billing-manage flotaryx-live-stripe-webhook; do
            supabase functions download "$fn" --project-ref "$PROJECT_REF" --use-api
          done
      - name: Validate and patch only restricted Live key checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          changes = {
              'flotaryx-live-create-checkout': (
                  'stripeKey.startsWith("sk_live_")',
                  '(stripeKey.startsWith("sk_live_") || stripeKey.startsWith("rk_live_"))'),
              'flotaryx-live-billing-manage': (
                  "stripeKey?.startsWith('sk_live_')",
                  "(stripeKey?.startsWith('sk_live_') || stripeKey?.startsWith('rk_live_'))"),
              'flotaryx-live-stripe-webhook': (
                  'key.startsWith("sk_live_")',
                  '(key.startsWith("sk_live_") || key.startsWith("rk_live_"))'),
          }
          for name, (old, new) in changes.items():
              path = Path('supabase/functions') / name / 'index.ts'
              if not path.is_file():
                  raise SystemExit(f'Missing downloaded function: {name}')
              source = path.read_text()
              if source.count(old) != 1:
                  raise SystemExit(f'Unexpected code for {name}; deployment stopped')
              if 'STRIPE_LIVE_SECRET_KEY' not in source or 'STRIPE_SECRET_KEY' in source or 'sk_test_' in source:
                  raise SystemExit(f'Live key isolation check failed for {name}')
              if name == 'flotaryx-live-create-checkout':
                  if 'FLOTARYX_LIVE_BILLING_ENABLED' not in source or 'eq.live' not in source:
                      raise SystemExit('Missing Live payment gate or live prices lookup')
              elif name == 'flotaryx-live-billing-manage':
                  if 'eq.live' not in source:
                      raise SystemExit('Missing Live plan price lookup')
              elif name == 'flotaryx-live-stripe-webhook':
                  if 'STRIPE_LIVE_WEBHOOK_SECRET' not in source or 'flotaryx_apply_live_stripe_subscription_event' not in source:
                      raise SystemExit('Missing webhook signing secret or Live reconciliation')
              path.write_text(source.replace(old, new))
              print(f'Updated restricted-key prefix guard in {name}')
          PY
      - name: Deploy isolated Live checkout with JWT verification
        shell: bash
        run: supabase functions deploy flotaryx-live-create-checkout --project-ref "$PROJECT_REF" --use-api
      - name: Deploy isolated Live billing management with JWT verification
        shell: bash
        run: supabase functions deploy flotaryx-live-billing-manage --project-ref "$PROJECT_REF" --use-api
      - name: Deploy isolated Live webhook (validates Stripe signatures itself)
        shell: bash
        run: supabase functions deploy flotaryx-live-stripe-webhook --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
