name: QA Driver RPC - disposable PostgreSQL isolation

on:
  pull_request:
    paths:
      - '.github/workflows/qa-driver-rpcs.yml'
      - 'supabase/qa_hardening/**'
      - 'tests/qa_driver_rpc*'
      - 'lib/drivers/driver_home_screen.dart'
      - 'supabase/migrations/001_fleetpilot.sql'
      - 'supabase/migrations/002_saas_foundation.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  driver-rpc-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: disposable-driver-rpc-2026
          POSTGRES_DB: fleet_driver_rpc_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d fleet_driver_rpc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: fleet_driver_rpc_test
      PGUSER: postgres
      PGPASSWORD: disposable-driver-rpc-2026
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          fi
          psql --version
      - name: Build synthetic tenants and exact staged migrations
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly no connection to hosted QA, production or customer records.
          psql -v ON_ERROR_STOP=1 \
            -f tests/qa_fleet_auth_bootstrap.sql \
            -f supabase/migrations/001_fleetpilot.sql \
            -f supabase/migrations/002_saas_foundation.sql \
            -f tests/qa_fleet_rls_fixture.sql \
            -f supabase/qa_hardening/001_restrict_fleet_documents_checks_change_requests.sql \
            -f supabase/qa_hardening/003_driver_membership_least_privilege.sql \
            -f tests/qa_driver_rpc_fixture.sql \
            -f supabase/qa_hardening/004_driver_read_rpcs.sql \
            -f supabase/qa_hardening/005_driver_write_rpcs.sql
      - name: Assert driver-specific RPC and manager approval boundary
        shell: bash
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f tests/qa_driver_rpc_isolation.sql
      - name: Refuse repeated installation before modifying any data
        shell: bash
        run: |
          set -euo pipefail
          if psql -v ON_ERROR_STOP=1 \
            -f supabase/qa_hardening/005_driver_write_rpcs.sql > "$RUNNER_TEMP/driver-rpc-repeat.log" 2>&1; then
            echo 'ERROR: repeat driver write migration unexpectedly succeeded' >&2
            exit 1
          fi
          grep -q 'Driver RPC already exists' "$RUNNER_TEMP/driver-rpc-repeat.log"
          echo 'PASS: repeat migration is blocked without altering database'
