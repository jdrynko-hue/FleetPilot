name: Upgrade FleetPilot UI

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/upgrade-ui.yml"

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Upgrade UI
        run: |
          cat > lib/core/theme.dart <<'DART'
          import 'package:flutter/material.dart';

          ThemeData buildFleetPilotTheme() {
            final scheme = ColorScheme.fromSeed(
              seedColor: const Color(0xFF234E84),
              brightness: Brightness.light,
            );

            return ThemeData(
              colorScheme: scheme,
              useMaterial3: true,
              scaffoldBackgroundColor: const Color(0xFFF3F6FA),
              appBarTheme: const AppBarTheme(
                backgroundColor: Colors.white,
                surfaceTintColor: Colors.transparent,
                elevation: 0,
              ),
              inputDecorationTheme: InputDecorationTheme(
                filled: true,
                fillColor: Colors.white,
                border: OutlineInputBorder(
                  borderRadius: BorderRadius.circular(16),
                ),
              ),
              cardTheme: CardThemeData(
                elevation: 0,
                color: Colors.white,
                shape: RoundedRectangleBorder(
                  borderRadius: BorderRadius.circular(18),
                ),
              ),
              navigationBarTheme: NavigationBarThemeData(
                height: 72,
                backgroundColor: Colors.white,
                indicatorColor: scheme.primaryContainer,
              ),
            );
          }
          DART

          python3 <<'PY'
          from pathlib import Path

          files = {
            "lib/shell/fleet_shell.dart": {
              "'Dashboard'": "'Start'",
              "'Vehicles'": "'Pojazdy'",
              "'Drivers'": "'Kierowcy'",
              "'Issues'": "'Usterki'",
              "'Repairs'": "'Naprawy'",
              "'Garages'": "'Warsztaty'",
              "'Company'": "'Firma'",
              "'More'": "'Więcej'",
              "'Refresh'": "'Odśwież'",
              "'Sign out'": "'Wyloguj'",
            },
            "lib/dashboard/dashboard_screen.dart": {
              "'Dashboard'": "'Panel floty'",
              "'Vehicles'": "'Pojazdy'",
              "'Unavailable'": "'Niedostępne'",
              "'Open issues'": "'Otwarte usterki'",
              "'Repair spend this month'": "'Koszt napraw w tym miesiącu'",
              "'Needs attention'": "'Wymaga uwagi'",
              "'Nothing urgent right now.'": "'Brak pilnych spraw.'",
              "'No driver assigned'": "'Brak przypisanego kierowcy'",
            },
            "lib/auth/login_screen.dart": {
              "'Create your account'": "'Utwórz konto'",
              "'Sign in to your fleet workspace'": "'Zaloguj się do swojej floty'",
              "'Password'": "'Hasło'",
              "'Create account'": "'Utwórz konto'",
              "'Sign in'": "'Zaloguj'",
              "'Already have an account? Sign in'": "'Masz już konto? Zaloguj się'",
              "'New to FleetPilot? Create an account'": "'Nie masz konta? Utwórz je'",
            },
            "lib/auth/create_company_screen.dart": {
              "'Create your workspace'": "'Utwórz swoją flotę'",
              "'Company name'": "'Nazwa firmy'",
              "'Country code'": "'Kod kraju'",
              "'Currency'": "'Waluta'",
              "'Create workspace'": "'Utwórz flotę'",
              "'Creating…'": "'Tworzenie…'",
            },
          }

          for file, replacements in files.items():
              p = Path(file)
              text = p.read_text()
              for old, new in replacements.items():
                  text = text.replace(old, new)
              p.write_text(text)
          PY

      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib
          git commit -m "Upgrade FleetPilot UI" || exit 0
          git push
