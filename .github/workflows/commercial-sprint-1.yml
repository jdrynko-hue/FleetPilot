name: Commercial Sprint 1

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/commercial-sprint-1.yml"

permissions:
  contents: write
  actions: write

jobs:
  commercial-sprint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Build Commercial Sprint 1
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json

          # =========================================================
          # MODELS — SaaS entitlements
          # =========================================================
          path = Path("lib/data/models.dart")
          s = path.read_text(encoding="utf-8")

          if "class CompanyEntitlements {" not in s:
              marker = "\nclass UserProfile {"
              pos = s.find(marker)

              if pos == -1:
                  raise SystemExit("Could not find model insertion point")

              model = r'''
          class CompanyEntitlements {
            CompanyEntitlements({
              required this.planCode,
              required this.planName,
              required this.subscriptionStatus,
              required this.isAccessActive,
              required this.vehicleCount,
              required this.canAddVehicle,
              required this.memberCount,
              required this.canAddMember,
              required this.features,
              this.trialEndsAt,
              this.trialDaysRemaining,
              this.vehicleLimit,
              this.memberLimit,
            });

            final String planCode;
            final String planName;
            final String subscriptionStatus;
            final DateTime? trialEndsAt;
            final int? trialDaysRemaining;
            final bool isAccessActive;

            final int? vehicleLimit;
            final int vehicleCount;
            final bool canAddVehicle;

            final int? memberLimit;
            final int memberCount;
            final bool canAddMember;

            final Map<String, dynamic> features;

            bool hasFeature(String key) => features[key] == true;

            factory CompanyEntitlements.fromJson(Json json) {
              return CompanyEntitlements(
                planCode: json['plan_code']?.toString() ?? 'trial',
                planName: json['plan_name']?.toString() ?? 'Trial',
                subscriptionStatus:
                    json['subscription_status']?.toString() ?? 'trialing',
                trialEndsAt: parseDate(json['trial_ends_at']),
                trialDaysRemaining:
                    (json['trial_days_remaining'] as num?)?.toInt(),
                isAccessActive: json['is_access_active'] as bool? ?? false,
                vehicleLimit: (json['vehicle_limit'] as num?)?.toInt(),
                vehicleCount:
                    (json['vehicle_count'] as num?)?.toInt() ?? 0,
                canAddVehicle: json['can_add_vehicle'] as bool? ?? false,
                memberLimit: (json['member_limit'] as num?)?.toInt(),
                memberCount:
                    (json['member_count'] as num?)?.toInt() ?? 0,
                canAddMember: json['can_add_member'] as bool? ?? false,
                features:
                    (json['features'] as Map?)?.cast<String, dynamic>() ?? {},
              );
            }
          }

          '''

              s = s[:pos] + "\n" + model + s[pos:]

          path.write_text(s, encoding="utf-8")


          # =========================================================
          # REPOSITORY — fetch subscription / limits
          # =========================================================
          path = Path("lib/data/fleet_repository.dart")
          s = path.read_text(encoding="utf-8")

          if "fetchCompanyEntitlements(" not in s:
              marker = "  Future<List<CompanyMember>> fetchCompanyMembers("
              pos = s.find(marker)

              if pos == -1:
                  raise SystemExit("Could not find repository insertion point")

              method = r'''
            Future<CompanyEntitlements> fetchCompanyEntitlements(
              String companyId,
            ) async {
              final result = await _client.rpc(
                'get_company_entitlements',
                params: {'_company_id': companyId},
              );

              if (result is List && result.isNotEmpty) {
                return CompanyEntitlements.fromJson(
                  (result.first as Map).cast<String, dynamic>(),
                );
              }

              throw StateError('Company subscription was not found');
            }

          '''

              s = s[:pos] + method + s[pos:]

          path.write_text(s, encoding="utf-8")


