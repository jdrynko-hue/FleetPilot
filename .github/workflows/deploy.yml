name: Deploy Flotaryx

# Publishing is intentionally manual. Merging a PR must never deploy public
# pages; do a production release only after approved acceptance gates.
on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: "Type PUBLISH-FLOTARYX to approve a production release from main"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Ref and explicit approval are both required; do not run from PR or tags.
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_release == 'PUBLISH-FLOTARYX' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create web files
        run: flutter create --platforms=web --project-name fleetpilot .

      - name: Install packages
        run: flutter pub get

      # The root URL hosts the marketing pages; Flutter must be built
      # separately at /app/ with its own bootstrap script and asset paths.
      - name: Stage Flutter portal entrypoint
        run: cp web/app/index.html web/index.html

      - name: Build Flutter portal
        run: >
          flutter build web
          --release
          --base-href "/app/"
          --dart-define=SUPABASE_URL=https://wqhymmtiawfwjikdaujo.supabase.co
          --dart-define=FLOTARYX_ECOSYSTEM_PRODUCTION=true
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_j638npcsGiRpQqYbVoz1Rg_qo4vA6tt

      - name: Assemble and validate public site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site
          # Preserve legal documents, branding, landing pages, CNAME and icons.
          cp -a web/. site/
          # Restore the marketing landing page from the checked-out commit.
          git show HEAD:web/index.html > site/index.html
          sed -i 's|<base href="\$FLUTTER_BASE_HREF">|<base href="/">|' site/index.html
          # Put all Flutter generated assets next to the /app/ entrypoint.
          mkdir -p site/app
          cp -a build/web/. site/app/
          test -s site/index.html
          test -s site/app/index.html
          test -s site/app/flutter_bootstrap.js
          test -s site/app/main.dart.js
          test -s site/CNAME
          grep -Fq '<base href="/app/">' site/app/index.html
          grep -Fq 'flutter_bootstrap.js' site/app/index.html
          grep -Fq 'flotaryx.com' site/CNAME

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      # A successful artifact upload is not proof that the public URLs work.
      - name: Smoke-test published Flotaryx URLs
        shell: bash
        run: |
          set -euo pipefail
          base="https://flotaryx.com"
          curl --fail --silent --show-error --location --retry 8 \
            --retry-delay 10 --retry-all-errors \
            "$base/" -o /tmp/flotaryx-home.html
          grep -Fq 'Flotaryx' /tmp/flotaryx-home.html
          curl --fail --silent --show-error --location --retry 8 \
            --retry-delay 10 --retry-all-errors \
            "$base/app/" -o /tmp/flotaryx-app.html
          grep -Fq '<base href="/app/">' /tmp/flotaryx-app.html
          grep -Fq 'flutter_bootstrap.js' /tmp/flotaryx-app.html
          for asset in flutter_bootstrap.js main.dart.js; do
            curl --fail --silent --show-error --location --retry 8 \
              --retry-delay 10 --retry-all-errors \
              "$base/app/$asset" -o /dev/null
          done
