name: Flotaryx - Business Review Console Installer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flotaryx-business-review-console-installer.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: flotaryx-business-review-console-installer
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install reviewed operator console
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INSTALL'
          import base64, gzip, pathlib, subprocess
          company = pathlib.Path('lib/company/company_screen.dart')
          screen = pathlib.Path('lib/company/business_review_console_screen.dart')
          expected = '6a6863623f867e3ae228a54ed9aaa0a443fb78fc'
          actual = subprocess.check_output(['git','hash-object',str(company)], text=True).strip()
          if actual != expected:
              raise SystemExit('Company page changed; installation stopped for review: '+actual)
          if screen.exists():
              raise SystemExit('Admin console exists; refusing to overwrite it')
          source = company.read_text(encoding='utf-8')
          def replace_once(old,new):
              global source
              if source.count(old) != 1:
                  raise SystemExit('Unexpected company page structure; stopped safely: '+old)
              source = source.replace(old,new,1)

          replace_once("import 'billing_screen.dart';", "import 'billing_screen.dart';\nimport 'business_review_console_screen.dart';")
          replace_once('  Future<List<CompanyInvite>>? _invites;', '  Future<List<CompanyInvite>>? _invites;\n  late Future<bool> _operatorAccess;')
          replace_once('  void initState() {\n    super.initState();', '  void initState() {\n    super.initState();\n    _operatorAccess = _fetchOperatorAccess();')
          marker='  void _reload() {'
          accessor='''  Future<bool> _fetchOperatorAccess() async {
              final client = Supabase.instance.client;
              final id = client.auth.currentUser?.id;
              if (id == null) return false;
              try {
                final rows = await client
                    .from('flotaryx_verification_operators')
                    .select('user_id')
                    .eq('user_id', id)
                    .limit(1);
                return rows.isNotEmpty;
              } catch (_) {
                return false;
              }
            }

          '''
          replace_once(marker,accessor+marker)
          before='''        if (_canAdmin)
                    Card(
                      child: ListTile(
                        leading: const Icon(Icons.business_center_outlined),'''
          card='''        FutureBuilder<bool>(
                    future: _operatorAccess,
                    builder: (context, snapshot) {
                      if (snapshot.data != true) {
                        return const SizedBox.shrink();
                      }
                      return Card(
                        child: ListTile(
                          leading: const Icon(Icons.admin_panel_settings_outlined),
                          title: Text(AppLocale.language.value == 'pl'
                              ? 'Panel weryfikacji firm'
                              : 'Business verification console'),
                          subtitle: Text(AppLocale.language.value == 'pl'
                              ? 'Ręczna weryfikacja zgłoszeń biznesowych'
                              : 'Review and verify business applications'),
                          trailing: const Icon(Icons.chevron_right),
                          onTap: () => Navigator.of(context).push(
                            MaterialPageRoute<void>(
                              builder: (_) => const BusinessReviewConsoleScreen(),
                            ),
                          ),
                        ),
                      );
                    },
                  ),

          '''
          replace_once(before,card+before)
          encoded=''
          data=gzip.decompress(base64.b64decode(encoded)).decode('utf-8')
          if len(data)<10000 or 'flotaryx_operator_review' not in data or 'p_expected_profile_updated_at' not in data:
              raise SystemExit('Unexpected admin console source; install cancelled')
          screen.write_text(data,encoding='utf-8')
          company.write_text(source,encoding='utf-8')
          print('Business review console installed. Live billing unchanged.')
          PY_INSTALL
      - name: Validate Flutter build and tests
        run: |
          flutter pub get
          dart format lib/company/company_screen.dart lib/company/business_review_console_screen.dart
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit validated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/company/company_screen.dart lib/company/business_review_console_screen.dart
          git diff --cached --quiet && { echo 'No changes'; exit 1; }
          git commit -m 'Add controlled B2B verification operator console'
          git push origin HEAD:main
      - name: Request site deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 8
          gh workflow run deploy.yml --ref main
