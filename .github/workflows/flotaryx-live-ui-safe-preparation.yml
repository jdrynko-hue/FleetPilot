name: Flotaryx Live UI Safe Preparation

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flotaryx-live-ui-safe-preparation
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Prepare dual-mode billing UI (no Live activation)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_PATCH'
          from pathlib import Path
          import subprocess

          path = Path('lib/company/billing_screen.dart')
          if not path.exists():
              raise SystemExit('Billing screen missing: no changes made')
          expected_blob = '463f8e2b62f24d0c7a847f760750e2233ebe7fcb'
          actual_blob = subprocess.check_output(['git', 'hash-object', str(path)], text=True).strip()
          if actual_blob != expected_blob:
              raise SystemExit(f'Billing screen changed since audit (expected {expected_blob}, found {actual_blob}); no changes made')
          source = path.read_text()

          def replace_once(before: str, after: str, title: str):
              global source
              found = source.count(before)
              if found != 1:
                  raise SystemExit(f'Unexpected {title} implementation ({found} matches); no changes made')
              source = source.replace(before, after, 1)

          replace_once(
              '  bool _busy = false;\n',
              '  bool _busy = false;\n'
              "  String _billingMode = 'test';\n"
              "  // A separate, explicit production launch is required. The existing Sandbox stays operational.\n"
              "  static const bool _liveBillingAvailable = bool.fromEnvironment(\n"
              "    'FLOTARYX_LIVE_BILLING', defaultValue: false,\n"
              "  );\n",
              'billing mode field')

          replace_once(
              "'plan_code,status,billing_provider,stripe_subscription_id,'\n",
              "'plan_code,status,billing_provider,stripe_subscription_id,stripe_price_id,'\n",
              'existing billing subscription selection')

          replace_once(
              "    if (hasStripe) {\n      final savedPlan = subscription['plan_code']?.toString();\n",
              "    String effectiveMode = 'test';\n"
              "    if (hasStripe) {\n"
              "      final existingPriceId = subscription['stripe_price_id']?.toString();\n"
              "      if (existingPriceId == null || !existingPriceId.startsWith('price_')) {\n"
              "        throw StateError('Cannot determine existing Stripe subscription environment');\n"
              "      }\n"
              "      final existingPrice = await client\n"
              "          .from('flotaryx_billing_prices')\n"
              "          .select('stripe_mode')\n"
              "          .eq('stripe_price_id', existingPriceId)\n"
              "          .maybeSingle();\n"
              "      final storedMode = existingPrice?['stripe_mode']?.toString();\n"
              "      if (storedMode != 'test' && storedMode != 'live') {\n"
              "        throw StateError('Existing subscription price has an unknown Stripe environment');\n"
              "      }\n"
              "      effectiveMode = storedMode!;\n"
              "    } else if (_liveBillingAvailable) {\n"
              "      effectiveMode = 'live';\n"
              "    }\n"
              "    _billingMode = effectiveMode;\n"
              "    if (hasStripe) {\n"
              "      final savedPlan = subscription['plan_code']?.toString();\n",
              'subscription environment lookup')

          replace_once("        .eq('stripe_mode', 'test')\n", "        .eq('stripe_mode', effectiveMode)\n", 'price environment filter')

          replace_once(
              "      'flotaryx-billing-manage',\n",
              "      _billingMode == 'live'\n"
              "          ? 'flotaryx-live-billing-manage'\n"
              "          : 'flotaryx-billing-manage',\n",
              'billing management endpoint selection')

          replace_once(
              "        'flotaryx-create-checkout',\n",
              "        _billingMode == 'live'\n"
              "            ? 'flotaryx-live-create-checkout'\n"
              "            : 'flotaryx-create-checkout',\n",
              'checkout endpoint selection')

          replace_once(
              "                        'SANDBOX — NO REAL CHARGES',\n"
              "                        'SANDBOX — BEZ PRAWDZIWYCH OPŁAT',\n",
              "                         _billingMode == 'live'\n"
              "                             ? 'LIVE — Real payments'\n"
              "                             : 'SANDBOX — NO REAL CHARGES',\n"
              "                         _billingMode == 'live'\n"
              "                             ? 'LIVE — Prawdziwe płatności'\n"
              "                             : 'SANDBOX — BEZ PRAWDZIWYCH OPŁAT',\n",
              'billing mode banner')

          replace_once(
              "                  onPressed: (!valid || _busy)\n                      ? null\n                      : () => _startCheckout(selected!, vehicles),\n",
              "                   onPressed: (!valid || _busy ||\n"
              "                           (_billingMode == 'live' && !_liveBillingAvailable))\n"
              "                      ? null\n"
              "                      : () => _startCheckout(selected!, vehicles),\n",
              'safe checkout button gate')

          replace_once(
              "                        : _t('Open test checkout', 'Otwórz płatność testową'),\n",
              "                         : _billingMode == 'live'\n"
              "                             ? _t('Open secure checkout', 'Otwórz bezpieczną płatność')\n"
              "                             : _t('Open test checkout', 'Otwórz płatność testową'),\n",
              'checkout label')

          replace_once(
              "                'Test environment only. GPS not included. Price changes can be prorated.',\n"
              "                'Tylko środowisko testowe. GPS nie jest wliczony. Zmiany ceny mogą być rozliczane proporcjonalnie.',\n",
              "                 _billingMode == 'live'\n"
              "                     ? 'Production subscriptions. GPS not included. Taxes may apply.'\n"
              "                     : 'Test environment only. GPS not included. Price changes can be prorated.',\n"
              "                 _billingMode == 'live'\n"
              "                     ? 'Abonament produkcyjny. GPS nie jest wliczony. Mogą być naliczone podatki.'\n"
              "                     : 'Tylko środowisko testowe. GPS nie jest wliczony. Zmiany ceny mogą być rozliczane proporcjonalnie.',\n",
              'environment footer')

          if 'FLOTARYX_LIVE_BILLING' not in source:
              raise SystemExit('Missing explicit production UI gate')
          if "defaultValue: false" not in source:
              raise SystemExit('Production UI gate must be disabled by default')
          if "'flotaryx-billing-manage'" not in source or "'flotaryx-live-billing-manage'" not in source:
              raise SystemExit('Both billing environments must remain in the UI')
          if "'flotaryx-create-checkout'" not in source or "'flotaryx-live-create-checkout'" not in source:
              raise SystemExit('Both checkout environments must remain in the UI')

          path.write_text(source)
          print('Staged dual-mode billing UI with Live launch disabled. Sandbox preserved.')
          PY_PATCH
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build and validate Flutter before committing
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=web --project-name fleetpilot .
          dart format lib/company/billing_screen.dart
          flutter pub get
          flutter test test/billing_screen_smoke_test.dart
          flutter build web --release --base-href "/" --dart-define=SUPABASE_URL=https://wqhymmtiawfwjikdaujo.supabase.co --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_j638npcsGiRpQqYbVoz1Rg_qo4vA6tt
      - name: Commit validated UI without production activation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/company/billing_screen.dart
          git diff --cached --quiet && { echo "No changes; already staged"; exit 0; }
          git commit -m "Prepare separate Stripe Live billing UI with launch gate off"
          git push origin HEAD:main
