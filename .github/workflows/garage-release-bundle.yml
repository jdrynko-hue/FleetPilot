name: Garage release bundle - disposable Auth and Storage

on:
  pull_request:
    paths:
      - 'supabase/garage_release/**'
      - 'supabase/garage_staging/**'
      - 'tools/prepare_garage_release.py'
      - '.github/workflows/garage-release-bundle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garage-supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GARAGE_QA_DIR: /tmp/flotaryx-garage-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - name: Prepare throwaway local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GARAGE_QA_DIR"
          cd "$GARAGE_QA_DIR"
          supabase init --yes
          mkdir -p supabase/migrations
          # This Fleet fixture is only installed inside the throwaway container.
          cp "$GITHUB_WORKSPACE/tests/repairbridge_fleet_fixture.sql" \
            supabase/migrations/20261017000100_local_fleet_fixture.sql
          python3 "$GITHUB_WORKSPACE/tools/prepare_garage_release.py" > \
            supabase/migrations/20261017000200_garage_release_baseline.sql
          # GoTrue signup on loopback must issue a session without contacting
          # external email providers. Never change this in hosted production.
          sed -i 's/^enable_confirmations = true$/enable_confirmations = false/' \
            supabase/config.toml
          if ! grep -q '^enable_confirmations = false$' supabase/config.toml; then
            echo 'Local Auth confirmation setting not found' >&2
            exit 1
          fi
      - name: Start local Auth, PostgREST and Postgres
        shell: bash
        run: |
          set -euo pipefail
          cd "$GARAGE_QA_DIR"
          supabase start -x studio,analytics,imgproxy
      - name: Exercise signups, tenant RLS, invites and assignment APIs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GARAGE_QA_DIR"
          supabase status -o env > "$RUNNER_TEMP/garage_supabase_env"
          get_local_setting() {
            sed -n "s/^$1=//p" "$RUNNER_TEMP/garage_supabase_env" | head -1 | tr -d '"'
          }
          export GARAGE_TEST_API_URL="$(get_local_setting API_URL)"
          export GARAGE_TEST_ANON_KEY="$(get_local_setting ANON_KEY)"
          if [[ -z "$GARAGE_TEST_API_URL" || -z "$GARAGE_TEST_ANON_KEY" ]]; then
            echo 'Missing local Supabase API URL or anon key' >&2
            exit 1
          fi
          echo "::add-mask::$GARAGE_TEST_ANON_KEY"
          node "$GITHUB_WORKSPACE/tests/garage_local_supabase_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/garage_repairbridge_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/garage_consumer_bookings_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/garage_resource_calendar_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/garage_mechanic_roster_e2e.mjs"
          node "$GITHUB_WORKSPACE/tests/flotaryx_unified_ecosystem_e2e.mjs"
          qa_db_url="$(get_local_setting DB_URL)"
          echo "::add-mask::$qa_db_url"
          psql "$qa_db_url" -v ON_ERROR_STOP=1 -f "$GITHUB_WORKSPACE/tests/garage_storage_operation_compat.sql"
      - name: Stop isolated Supabase services
        if: always()
        shell: bash
        run: |
          if [[ -d "$GARAGE_QA_DIR/supabase" ]]; then
            cd "$GARAGE_QA_DIR"
            supabase stop --no-backup || true
          fi
