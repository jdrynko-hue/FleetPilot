name: Password recovery regression tests

on:
  push:
    branches: [main]
    paths:
      - 'lib/auth/**'
      - 'lib/main.dart'
      - 'lib/app.dart'
      - 'lib/data/fleet_repository.dart'
      - 'test/password_recovery_test.dart'
      - 'test/password_policy_test.dart'
      - '.github/workflows/password-recovery-test.yml'
      - 'pubspec.*'
  pull_request:
    paths:
      - 'lib/auth/**'
      - 'lib/data/fleet_repository.dart'
      - 'test/password_recovery_test.dart'
      - 'test/password_policy_test.dart'
      - '.github/workflows/password-recovery-test.yml'
      - 'pubspec.*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/main.dart lib/app.dart lib/auth/forgot_password_screen.dart lib/auth/password_recovery_screen.dart lib/auth/auth_gate.dart lib/auth/login_screen.dart lib/data/fleet_repository.dart test/password_recovery_test.dart lib/auth/password_policy.dart test/password_policy_test.dart
      - run: flutter analyze lib/main.dart lib/app.dart lib/auth/forgot_password_screen.dart lib/auth/password_recovery_screen.dart lib/auth/auth_gate.dart lib/auth/login_screen.dart lib/auth/password_policy.dart lib/data/fleet_repository.dart test/password_recovery_test.dart test/password_policy_test.dart --no-fatal-infos
      - run: flutter test test/password_recovery_test.dart test/password_policy_test.dart
