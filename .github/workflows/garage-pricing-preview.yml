name: Garage subscription pricing UX safety checks

on:
  pull_request:
    paths:
      - 'web/garage-pricing-preview/**'
      - 'tests/garage_pricing_preview_test.*'
      - '.github/workflows/garage-pricing-preview.yml'
  push:
    branches:
      - 'design/garage-subscription-pricing-ux-20261015'
    paths:
      - 'web/garage-pricing-preview/**'
      - 'tests/garage_pricing_preview_test.*'
      - '.github/workflows/garage-pricing-preview.yml'

permissions:
  contents: read

jobs:
  pricing-ux:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check no live purchase and full price matrix
        run: python3 -m unittest discover -s tests -p garage_pricing_preview_test.py -v
      - name: Exercise preview's currency, billing and language toggles
        run: node tests/garage_pricing_preview_test.mjs
