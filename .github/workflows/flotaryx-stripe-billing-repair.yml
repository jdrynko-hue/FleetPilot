name: Flotaryx - Repair and Publish Sandbox Billing

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flotaryx-stripe-billing-repair.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flotaryx-stripe-billing-repair
  cancel-in-progress: false

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Restore billing screen from original installer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCODE'
          from pathlib import Path
          from textwrap import dedent

          source_path = Path('.github/workflows/flotaryx-stripe-billing-install.yml')
          source = source_path.read_text(encoding='utf-8')
          start = "          python3 - <<'PYCODE'\n"
          end = "\n          PYCODE"
          if source.count(start) != 1:
              raise SystemExit('Expected one original billing installer block')
          code = source.split(start, 1)[1].split(end, 1)[0]
          code = dedent(code)
          if "billing.write_bytes(base64.b64decode" not in code:
              raise SystemExit('Cannot safely identify original billing installer')
          exec(compile(code, str(source_path), 'exec'), {'__name__': '__main__'})
          assert Path('lib/company/billing_screen.dart').exists(), 'Missing billing page'
          assert "BillingScreen(company: widget.company)" in Path(
              'lib/company/company_screen.dart').read_text(encoding='utf-8')
          print('Restored billing screen and company navigation')
          PYCODE

      - name: Generate Flutter platform and remove unrelated sample test
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=web --project-name fleetpilot .
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess

          example = Path('test/widget_test.dart')
          if example.is_file():
              is_tracked = subprocess.run(
                  ['git', 'ls-files', '--error-unmatch', str(example)],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
                  check=False
              ).returncode == 0
              source = example.read_text(encoding='utf-8')
              if not is_tracked and 'MyApp' in source:
                  example.unlink()
                  print('Removed only the untracked Flutter MyApp placeholder test')
              elif 'MyApp' in source:
                  raise SystemExit('Existing tracked MyApp test needs investigation')
          PYCODE
          flutter pub get
          dart format lib/company/billing_screen.dart lib/company/company_screen.dart

      - name: Analyze, test and compile updated application
        shell: bash
        run: |
          set -euo pipefail
          flutter analyze --no-fatal-infos
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test
          else
            echo 'No project test files after removal of generated placeholder.'
          fi
          flutter build web --release --base-href '/' \
            --dart-define=SUPABASE_URL=https://wqhymmtiawfwjikdaujo.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_j638npcsGiRpQqYbVoz1Rg_qo4vA6tt
          python3 - <<'PYCODE'
          from pathlib import Path
          built = Path('build/web')
          assert (built / 'main.dart.js').is_file(), 'Flutter application is missing'
          assert (built / 'app/index.html').is_file(), '/app/ entry point missing'
          assert 'href="/app/"' in (built / 'index.html').read_text(encoding='utf-8'), 'Product website links missing'
          print('Website homepage and Flutter app build verified')
          PYCODE

      - name: Commit billing UI to main and trigger Pages deployment
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/company/billing_screen.dart lib/company/company_screen.dart
          if git diff --cached --quiet; then
            echo 'Flotaryx billing UI already installed on main.'
          else
            git commit -m 'Install localized Flotaryx sandbox subscription UI'
            git push origin HEAD:main
          fi
          echo 'GitHub Pages deploy.yml is triggered by pushes to main.'
