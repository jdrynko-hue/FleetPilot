name: FleetPilot Email Test Button

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fleetpilot-email-test-button.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Add authenticated email test button
        shell: bash
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import base64
          import json

          screen = Path('lib/company/company_screen.dart')
          s = screen.read_text(encoding='utf-8')
          assert "_emailTestSending" not in s, 'Button already installed; do not duplicate'
          anchor = "import 'package:flutter/services.dart';\n"
          assert s.count(anchor) == 1
          s = s.replace(anchor, anchor + "import 'package:supabase_flutter/supabase_flutter.dart';\n", 1)

          method_anchor = '  Future<void> _changeLanguage(String value) async {'
          assert s.count(method_anchor) == 1
          s = s.replace(method_anchor, base64.b64decode('').decode() + method_anchor, 1)

          card_anchor = "        SizedBox(height: 24),\n\n        Row(\n          children: ["
          assert s.count(card_anchor) == 1, 'Company screen insertion point changed'
          s = s.replace(card_anchor, base64.b64decode('').decode() + card_anchor, 1)
          screen.write_text(s, encoding='utf-8')

          locale = Path('lib/core/localization.dart')
          l = locale.read_text(encoding='utf-8')
          translations = json.loads(base64.b64decode(''))
          keys = ['email_smoke_title', 'email_smoke_button', 'email_smoke_description', 'email_smoke_sending', 'email_smoke_accepted', 'email_smoke_failed']
          assert ('"email_smoke_title"') not in l, 'Localization already installed'
          for lang, values in translations.items():
              assert len(values) == len(keys)
              anchor = '  "' + lang + '": <String, String>{\n'
              assert l.count(anchor) == 1, 'Missing localization: ' + lang
              rows = ''.join('    ' + json.dumps(k, ensure_ascii=False) + ': ' + json.dumps(v, ensure_ascii=False) + ',\n' for k,v in zip(keys,values))
              l = l.replace(anchor, anchor + rows, 1)
          locale.write_text(l, encoding='utf-8')
          print('Installed single-send test email button for admins in 12 languages.')
          PYTHON
      - name: Verify and test app
        run: |
          flutter pub get
          dart format lib/company/company_screen.dart lib/core/localization.dart
          flutter analyze --no-fatal-infos
          flutter test
      - name: Save verified changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/company/company_screen.dart lib/core/localization.dart
          git commit -m 'Add authenticated Resend smoke test to company settings'
          git push
      - name: Publish FleetPilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
