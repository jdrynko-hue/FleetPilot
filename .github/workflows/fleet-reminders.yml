name: Fleet Reminders 30 14 7

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/fleet-reminders.yml"

permissions:
  contents: write
  actions: write

jobs:
  reminders:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Add 30 14 7 reminders
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("lib/dashboard/dashboard_screen.dart")
          s = path.read_text(encoding="utf-8")

          start = s.find("        final attention = <_AttentionItem>[];")
          end_marker = """        return RefreshIndicator("""
          end = s.find(end_marker, start)

          if start == -1 or end == -1:
              raise SystemExit("Could not find dashboard attention section")

          new = r"""        final attention = <_AttentionItem>[];

          final today = DateTime(now.year, now.month, now.day);

          int daysUntil(DateTime date) {
            final target = DateTime(date.year, date.month, date.day);
            return target.difference(today).inDays;
          }

          String reminderBand(int days) {
            if (days < 0) return '!';
            if (days <= 7) return '≤7d';
            if (days <= 14) return '≤14d';
            return '≤30d';
          }

          void addDateReminder({
            required Vehicle vehicle,
            required String label,
            required DateTime? date,
            required IconData icon,
          }) {
            if (date == null) return;

            final days = daysUntil(date);

            if (days <= 30) {
              attention.add(
                _AttentionItem(
                  icon: icon,
                  title: '${vehicle.registration} — $label',
                  subtitle:
                      '${reminderBand(days)} • ${tr('due_date')}: ${formatDate(date)}',
                  sortOrder: days,
                ),
              );
            }
          }

          for (final vehicle in data.vehicles) {
            addDateReminder(
              vehicle: vehicle,
              label: vehicle.inspectionType,
              date: vehicle.inspectionDueDate,
              icon: Icons.fact_check_outlined,
            );

            addDateReminder(
              vehicle: vehicle,
              label: tr('service'),
              date: vehicle.serviceDueDate,
              icon: Icons.build_outlined,
            );

            addDateReminder(
              vehicle: vehicle,
              label: tr('insurance'),
              date: vehicle.insuranceExpiryDate,
              icon: Icons.shield_outlined,
            );
          }

          for (final issue in activeIssues) {
            if (issue.priority == 'high' || issue.priority == 'critical') {
              attention.add(
                _AttentionItem(
                  icon: Icons.warning_amber_rounded,
                  title:
                      '${issue.registration ?? tr('vehicle')} — ${issue.title}',
                  subtitle: issue.priority == 'critical'
                      ? tr('critical_priority')
                      : tr('high_priority'),
                  sortOrder: issue.priority == 'critical' ? -10000 : -9000,
                ),
              );
            }
          }

          attention.sort(
            (a, b) => a.sortOrder.compareTo(b.sortOrder),
          );

          """

          s = s[:start] + new + s[end:]

          old_class = """class _AttentionItem {
            _AttentionItem({
              required this.icon,
              required this.title,
              required this.subtitle,
            });

            final IconData icon;
            final String title;
            final String subtitle;
          }"""

          new_class = """class _AttentionItem {
            _AttentionItem({
              required this.icon,
              required this.title,
              required this.subtitle,
              required this.sortOrder,
            });

            final IconData icon;
            final String title;
            final String subtitle;
            final int sortOrder;
          }"""

          if old_class not in s:
              raise SystemExit("Could not find AttentionItem class")

          s = s.replace(old_class, new_class, 1)

          path.write_text(s, encoding="utf-8")
          PY

      - name: Test
        run: |
          flutter pub get
          dart format lib/dashboard/dashboard_screen.dart
          flutter analyze --no-fatal-infos

      - name: Save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/dashboard/dashboard_screen.dart
          git commit -m "Add 30 14 7 fleet reminders"
          git push

      - name: Deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 5
          gh workflow run deploy.yml --ref main
