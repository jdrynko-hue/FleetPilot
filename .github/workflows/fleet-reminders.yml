name: Fleet insurance reminder validation

on:
  push:
    branches:
      - main
    paths:
      - "lib/vehicles/insurance_expiry.dart"
      - "lib/vehicles/vehicle_list_tile.dart"
      - "lib/vehicles/vehicles_screen.dart"
      - "test/vehicle_insurance_test.dart"
      - ".github/workflows/fleet-reminders.yml"
  pull_request:
    paths:
      - "lib/vehicles/insurance_expiry.dart"
      - "lib/vehicles/vehicle_list_tile.dart"
      - "lib/vehicles/vehicles_screen.dart"
      - "test/vehicle_insurance_test.dart"
      - ".github/workflows/fleet-reminders.yml"

permissions:
  contents: read

jobs:
  insurance-reminders:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Verify insurance reminder behavior
        run: flutter test test/vehicle_insurance_test.dart
