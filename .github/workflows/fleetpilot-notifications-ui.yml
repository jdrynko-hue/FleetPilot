name: FleetPilot Notification Centre
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fleetpilot-notifications-ui.yml"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install notification centre and 12 translations
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, json
          
          files = {'lib/notifications/notifications_screen.dart': ''}
          for path, encoded in files.items():
              destination = Path(path)
              if destination.exists():
                  raise SystemExit('Notifications screen already exists: ' + path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(base64.b64decode(encoded))
          
          shell_path = Path('lib/shell/fleet_shell.dart')
          shell = shell_path.read_text(encoding='utf-8')
          import_anchor = "import '../issues/issues_screen.dart';"
          assert shell.count(import_anchor) == 1, 'Shell import anchor changed'
          shell = shell.replace(import_anchor, import_anchor + '\n' + "import '../notifications/notifications_screen.dart';", 1)
          nav_anchor = "              IconButton(\n                tooltip: tr('refresh'),"
          assert shell.count(nav_anchor) == 1, 'Shell bell anchor changed'
          shell = shell.replace(nav_anchor, "              IconButton(\n                tooltip: tr('notifications'),\n                icon: const Icon(Icons.notifications_outlined),\n                onPressed: () => Navigator.of(context).push<void>(\n                  MaterialPageRoute(\n                    builder: (_) => NotificationsScreen(company: _membership),\n                  ),\n                ),\n              ),\n" + nav_anchor, 1)
          shell_path.write_text(shell, encoding='utf-8')
          
          translations = {'notifications': ['Powiadomienia', 'Notifications', 'Benachrichtigungen', 'Upozornenia', 'Oznámení', 'Értesítések', 'Notificări', 'Notificaciones', 'Notifications', 'Notifiche', 'Сповіщення', 'Notificações'], 'notification_sign_in': ['Zaloguj się ponownie.', 'Please sign in again.', 'Bitte erneut anmelden.', 'Prihláste sa znova.', 'Přihlaste se znovu.', 'Jelentkezz be újra.', 'Autentifică-te din nou.', 'Inicia sesión otra vez.', 'Veuillez vous reconnecter.', 'Accedi di nuovo.', 'Увійдіть знову.', 'Inicie sessão novamente.'], 'notification_error': ['Błąd powiadomień', 'Notification error', 'Benachrichtigungsfehler', 'Chyba upozornení', 'Chyba oznámení', 'Értesítési hiba', 'Eroare notificări', 'Error de notificaciones', 'Erreur de notification', 'Errore notifiche', 'Помилка сповіщень', 'Erro de notificações'], 'notification_mot': ['Przegląd / MOT', 'Inspection / MOT', 'Prüfung / MOT', 'Kontrola / MOT', 'Kontrola / MOT', 'Műszaki vizsga / MOT', 'Inspecție / MOT', 'Inspección / MOT', 'Contrôle / MOT', 'Revisione / MOT', 'Техогляд / MOT', 'Inspeção / MOT'], 'notification_insurance': ['Ubezpieczenie', 'Insurance', 'Versicherung', 'Poistenie', 'Pojištění', 'Biztosítás', 'Asigurare', 'Seguro', 'Assurance', 'Assicurazione', 'Страхування', 'Seguro'], 'notification_service_date': ['Termin serwisu', 'Service date', 'Servicetermin', 'Termín servisu', 'Termín servisu', 'Szerviz időpontja', 'Data reviziei', 'Fecha de mantenimiento', 'Date d’entretien', 'Data manutenzione', 'Дата сервісу', 'Data da revisão'], 'notification_service_mileage': ['Serwis wg przebiegu', 'Mileage service', 'Kilometer-Service', 'Servis podľa nájazdu', 'Servis podle nájezdu', 'Kilométer alapú szerviz', 'Revizie la kilometraj', 'Mantenimiento por kilometraje', 'Entretien kilométrique', 'Manutenzione chilometrica', 'Сервіс за пробігом', 'Revisão por quilometragem'], 'notification_overdue': ['Po terminie', 'Overdue', 'Überfällig', 'Po termíne', 'Po termínu', 'Lejárt', 'Depășit', 'Vencido', 'En retard', 'Scaduto', 'Прострочено', 'Vencido'], 'notification_due_now': ['Wymagany serwis', 'Service due now', 'Service fällig', 'Servis je potrebný', 'Servis je nutný', 'Szerviz esedékes', 'Revizie necesară', 'Mantenimiento pendiente', 'Entretien à faire', 'Manutenzione necessaria', 'Потрібен сервіс', 'Revisão necessária'], 'notification_due_today': ['Termin dzisiaj', 'Due today', 'Heute fällig', 'Termín dnes', 'Termín dnes', 'Ma esedékes', 'Scadent astăzi', 'Vence hoy', 'Échéance aujourd’hui', 'Scade oggi', 'Термін сьогодні', 'Vence hoje'], 'notification_mileage_window': ['Zbliża się serwis', 'Service approaching', 'Service rückt näher', 'Blíži sa servis', 'Blíží se servis', 'Közeledő szerviz', 'Se apropie revizia', 'Se acerca el mantenimiento', 'Entretien à prévoir', 'Manutenzione in arrivo', 'Наближається сервіс', 'Revisão próxima'], 'notification_target': ['Przebieg docelowy', 'Target mileage', 'Zielkilometerstand', 'Cieľový nájazd', 'Cílový nájezd', 'Cél kilométerállás', 'Kilometraj țintă', 'Kilometraje objetivo', 'Kilométrage prévu', 'Chilometraggio previsto', 'Плановий пробіг', 'Quilometragem prevista'], 'notification_within': ['W ciągu', 'Within', 'Innerhalb von', 'Do', 'Do', 'Ezen belül', 'În', 'Dentro de', 'Dans', 'Entro', 'Протягом', 'Dentro de'], 'notification_days': ['dni', 'days', 'Tagen', 'dní', 'dnů', 'nap', 'zile', 'días', 'jours', 'giorni', 'днів', 'dias'], 'notification_due': ['Termin', 'Due date', 'Fällig am', 'Termín', 'Termín', 'Határidő', 'Scadență', 'Fecha límite', 'Échéance', 'Scadenza', 'Термін', 'Data limite'], 'notification_inbox': ['Centrum powiadomień', 'Notification centre', 'Benachrichtigungszentrale', 'Centrum upozornení', 'Centrum oznámení', 'Értesítési központ', 'Centru notificări', 'Centro de notificaciones', 'Centre de notifications', 'Centro notifiche', 'Центр сповіщень', 'Centro de notificações'], 'notification_all': ['Wszystkie', 'All', 'Alle', 'Všetky', 'Všechna', 'Összes', 'Toate', 'Todas', 'Toutes', 'Tutte', 'Усі', 'Todas'], 'notification_unread': ['Nieprzeczytane', 'Unread', 'Ungelesen', 'Neprečítané', 'Nepřečtené', 'Olvasatlan', 'Necitite', 'No leídas', 'Non lues', 'Non lette', 'Непрочитані', 'Não lidas'], 'notification_empty': ['Nie masz powiadomień w tym widoku.', 'No notifications to show.', 'Keine Benachrichtigungen vorhanden.', 'Žiadne upozornenia.', 'Žádná oznámení.', 'Nincs megjeleníthető értesítés.', 'Nu există notificări.', 'No hay notificaciones.', 'Aucune notification à afficher.', 'Nessuna notifica da mostrare.', 'Немає сповіщень.', 'Sem notificações a apresentar.'], 'notification_mark_read': ['Oznacz jako przeczytane', 'Mark as read', 'Als gelesen markieren', 'Označiť ako prečítané', 'Označit jako přečtené', 'Megjelölés olvasottként', 'Marchează ca citit', 'Marcar como leída', 'Marquer comme lue', 'Segna come letta', 'Позначити прочитаним', 'Marcar como lida'], 'notification_preferences': ['Ustawienia powiadomień', 'Notification settings', 'Benachrichtigungseinstellungen', 'Nastavenia upozornení', 'Nastavení oznámení', 'Értesítési beállítások', 'Setări notificări', 'Ajustes de notificaciones', 'Paramètres de notification', 'Impostazioni notifiche', 'Налаштування сповіщень', 'Definições de notificações'], 'notification_in_app': ['Powiadomienia w aplikacji', 'In-app notifications', 'In-App-Benachrichtigungen', 'Upozornenia v aplikácii', 'Oznámení v aplikaci', 'Alkalmazáson belüli értesítések', 'Notificări în aplicație', 'Notificaciones en la aplicación', 'Notifications dans l’application', 'Notifiche nell’app', 'Сповіщення в застосунку', 'Notificações na aplicação'], 'notification_service': ['Serwis', 'Service', 'Service', 'Servis', 'Servis', 'Szerviz', 'Revizie', 'Mantenimiento', 'Entretien', 'Manutenzione', 'Сервіс', 'Manutenção'], 'notification_email': ['Powiadomienia e-mail', 'Email notifications', 'E-Mail-Benachrichtigungen', 'E-mailové upozornenia', 'E-mailová oznámení', 'E-mail értesítések', 'Notificări e-mail', 'Notificaciones por correo', 'Notifications par e-mail', 'Notifiche email', 'Сповіщення електронною поштою', 'Notificações por e-mail'], 'notification_email_soon': ['Wysyłkę e-mail uruchomimy w kolejnym etapie.', 'Email delivery will be enabled in a later step.', 'E-Mail-Versand wird später aktiviert.', 'E-maily zapneme v ďalšej fáze.', 'E-maily zapneme v další fázi.', 'E-mail küldés később lesz elérhető.', 'Trimiterea e-mail va fi activată ulterior.', 'El correo se activará más adelante.', 'L’envoi par e-mail sera activé plus tard.', 'Le email saranno attivate in seguito.', 'Надсилання листів увімкнемо пізніше.', 'O envio por e-mail será ativado depois.'], 'notification_schedule_pending': ['Automatyczne tworzenie alertów według harmonogramu nie jest jeszcze włączone.', 'Scheduled alert generation is not enabled yet.', 'Die automatische Erstellung von Warnungen ist noch nicht aktiviert.', 'Automatické vytváranie upozornení ešte nie je aktívne.', 'Automatické vytváření oznámení zatím není zapnuté.', 'Az ütemezett értesítések még nincsenek bekapcsolva.', 'Generarea programată a notificărilor nu este încă activă.', 'La generación automática aún no está activada.', 'La génération planifiée n’est pas encore activée.', 'La generazione programmata non è ancora attiva.', 'Автоматичне створення сповіщень ще не активовано.', 'A geração automática ainda não está ativa.']}
          languages = ['pl', 'en', 'de', 'sk', 'cs', 'hu', 'ro', 'es', 'fr', 'it', 'uk', 'pt']
          localization_path = Path('lib/core/localization.dart')
          locale = localization_path.read_text(encoding='utf-8')
          for index, language in enumerate(languages):
              anchor = '  "' + language + '": <String, String>{\n'
              assert locale.count(anchor) == 1, 'Localization block missing or duplicate: ' + language
              rows = ''.join('    ' + json.dumps(key, ensure_ascii=False) + ': '
                             + json.dumps(values[index], ensure_ascii=False) + ',\n'
                             for key, values in translations.items())
              locale = locale.replace(anchor, anchor + rows, 1)
          localization_path.write_text(locale, encoding='utf-8')
          print('Notification inbox and preferences installed in 12 languages')
          PY
      - name: Validate source and run all Flutter tests
        run: |
          flutter pub get
          dart format lib/notifications lib/shell/fleet_shell.dart lib/core/localization.dart
          flutter analyze --no-fatal-infos
          flutter test
      - name: Commit verified files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/notifications lib/shell/fleet_shell.dart lib/core/localization.dart
          git commit -m "Add multi-company notification inbox and preferences"
          git push
      - name: Publish FleetPilot
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
