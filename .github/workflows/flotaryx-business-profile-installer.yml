ária antes dos pagamentos reais.', 'Nome legal da empresa', 'Número de registo (opcional)', 'Número de IVA (opcional)', 'Morada, linha 1', 'Morada, linha 2 (opcional)', 'Cidade', 'Região (opcional)', 'Código postal', 'Atividade empresarial (opcional)', 'Ligação ao registo comercial ou outra prova (opcional)', 'País de faturação', 'Enviar para verificação', 'A guardar...', 'Dados guardados. Aguarde a verificação.', 'Não foi possível carregar ou guardar os dados.', 'Preencha este campo obrigatório.', 'País da empresa inválido. Contacte o suporte.', 'Notas do verificador', 'Sem número de IVA? Pode fornecer outras provas de atividade.', 'Não enviado', 'A aguardar verificação', 'São necessárias mais informações', 'Empresa verificada', 'Verificação recusada', 'Confirme que está a agir como empresa.']}.items():
              anchor = f'  "{lang}": <String, String>{{'
              if source.count(anchor)!=1:
                  raise SystemExit(f'Missing unique language anchor: {lang}')
              inserted = ''.join('    '+json.dumps('business_profile_'+key,ensure_ascii=False)+': '+json.dumps(value,ensure_ascii=False)+',\n' for key, value in zip(['title', 'subtitle', 'legal', 'reg', 'vat', 'address1', 'address2', 'city', 'region', 'postcode', 'activity', 'evidence', 'country', 'submit', 'saving', 'saved', 'failed', 'required', 'country_invalid', 'review_note', 'vat_optional', 'status_none', 'status_pending', 'status_needs_info', 'status_verified', 'status_rejected', 'attestation_required'],entries))
              source = source.replace(anchor,anchor+'\n'+inserted,1)

          new_screen.write_text("import 'package:flutter/material.dart';\nimport 'package:supabase_flutter/supabase_flutter.dart';\n\nimport '../core/localization.dart';\nimport '../data/models.dart';\n\nclass BusinessVerificationScreen extends StatefulWidget {\n  const BusinessVerificationScreen({required this.company, super.key});\n\n  final CompanyMembership company;\n\n  @override\n  State<BusinessVerificationScreen> createState() =>\n      _BusinessVerificationScreenState();\n}\n\nclass _BusinessVerificationScreenState\n    extends State<BusinessVerificationScreen> {\n  final _formKey = GlobalKey<FormState>();\n  final _fields = <String, TextEditingController>{\n    for (final field in [\n      'legal_name',\n      'registration_number',\n      'vat_number',\n      'billing_address_line1',\n      'billing_address_line2',\n      'billing_city',\n      'billing_region',\n      'billing_postcode',\n      'business_activity',\n      'evidence_reference',\n    ])\n      field: TextEditingController(),\n  };\n\n  bool _loading = true;\n  bool _saving = false;\n  bool _exists = false;\n  bool _attested = false;\n  String _country = '';\n  String _status = 'not_submitted';\n  String? _reviewNote;\n  String? _error;\n\n  @override\n  void initState() {\n    super.initState();\n    _load();\n  }\n\n  @override\n  void dispose() {\n    for (final controller in _fields.values) {\n      controller.dispose();\n    }\n    super.dispose();\n  }\n\n  Future<void> _load() async {\n    setState(() {\n      _loading = true;\n      _error = null;\n    });\n    try {\n      final client = Supabase.instance.client;\n      final id = widget.company.companyId;\n      final company = await client\n          .from('companies')\n          .select('country')\n          .eq('id', id)\n          .single();\n      final profile = await client\n          .from('flotaryx_business_profiles')\n          .select()\n          .eq('company_id', id)\n          .maybeSingle();\n      final review = await client\n          .from('flotaryx_business_reviews')\n          .select('status,review_note')\n          .eq('company_id', id)\n          .maybeSingle();\n      if (!mounted) return;\n      for (final field in _fields.keys) {\n        _fields[field]!.text = profile?[field]?.toString() ?? '';\n      }\n      setState(() {\n        _country = (company['country']?.toString() ?? '').trim().toUpperCase();\n        _exists = profile != null;\n        _attested = profile?['business_use_attested'] == true;\n        _status = review?['status']?.toString() ?? 'not_submitted';\n        _reviewNote = review?['review_note']?.toString();\n      });\n    } catch (_) {\n      if (mounted) setState(() => _error = tr('business_profile_failed'));\n    } finally {\n      if (mounted) setState(() => _loading = false);\n    }\n  }\n\n  Widget _field(\n    String field,\n    String label, {\n    bool mandatory = false,\n    int minLength = 1,\n    int maxLength = 150,\n    bool multiline = false,\n  }) {\n    return Padding(\n      padding: const EdgeInsets.only(bottom: 14),\n      child: TextFormField(\n        controller: _fields[field],\n        maxLength: maxLength,\n        maxLines: multiline ? 3 : 1,\n        decoration: InputDecoration(\n          labelText: label,\n          border: const OutlineInputBorder(),\n        ),\n        validator: (value) {\n          final text = (value ?? '').trim();\n          if (mandatory && text.length < minLength) {\n            return tr('business_profile_required');\n          }\n          return null;\n        },\n      ),\n    );\n  }\n\n  Future<void> _save() async {\n    if (_saving || !_formKey.currentState!.validate()) return;\n    if (!_attested) {\n      setState(() => _error = tr('business_profile_attestation_required'));\n      return;\n    }\n    if (!RegExp(r'^[A-Z]{2}$').hasMatch(_country)) {\n      setState(() => _error = tr('business_profile_country_invalid'));\n      return;\n    }\n    setState(() {\n      _saving = true;\n      _error = null;\n    });\n    try {\n      final client = Supabase.instance.client;\n      final values = <String, dynamic>{\n        for (final field in _fields.keys)\n          field: _fields[field]!.text.trim().isEmpty\n              ? null\n              : _fields[field]!.text.trim(),\n        'business_country': _country,\n        'business_use_attested': true,\n      };\n      if (_exists) {\n        await client\n            .from('flotaryx_business_profiles')\n            .update(values)\n            .eq('company_id', widget.company.companyId);\n      } else {\n        await client.from('flotaryx_business_profiles').insert({\n          'company_id': widget.company.companyId,\n          ...values,\n        });\n      }\n      if (!mounted) return;\n      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(content: Text(tr('business_profile_saved'))),\n      );\n      await _load();\n    } catch (_) {\n      if (mounted) setState(() => _error = tr('business_profile_failed'));\n    } finally {\n      if (mounted) setState(() => _saving = false);\n    }\n  }\n\n  String get _statusLabel {\n    const labels = {\n      'not_submitted': 'business_profile_status_none',\n      'pending': 'business_profile_status_pending',\n      'needs_info': 'business_profile_status_needs_info',\n      'verified': 'business_profile_status_verified',\n      'rejected': 'business_profile_status_rejected',\n    };\n    return tr(labels[_status] ?? 'business_profile_status_pending');\n  }\n\n  @override\n  Widget build(BuildContext context) {\n    return Scaffold(\n      appBar: AppBar(title: Text(tr('business_profile_title'))),\n      body: _loading\n          ? const Center(child: CircularProgressIndicator())\n          : Center(\n              child: ConstrainedBox(\n                constraints: const BoxConstraints(maxWidth: 700),\n                child: ListView(\n                  padding: const EdgeInsets.all(16),\n                  children: [\n                    Text(tr('business_profile_subtitle')),\n                    const SizedBox(height: 12),\n                    Card(\n                      child: Padding(\n                        padding: const EdgeInsets.all(16),\n                        child: Column(\n                          crossAxisAlignment: CrossAxisAlignment.start,\n                          children: [\n                            Text(_statusLabel,\n                                style: Theme.of(context).textTheme.titleMedium),\n                            if (_reviewNote != null && _reviewNote!.isNotEmpty) ...[\n                              const SizedBox(height: 8),\n                              Text('${tr('business_profile_review_note')}: $_reviewNote'),\n                            ],\n                          ],\n                        ),\n                      ),\n                    ),\n                    const SizedBox(height: 16),\n                    Form(\n                      key: _formKey,\n                      child: Column(\n                        crossAxisAlignment: CrossAxisAlignment.stretch,\n                        children: [\n                          InputDecorator(\n                            decoration: InputDecoration(\n                              labelText: tr('business_profile_country'),\n                              border: const OutlineInputBorder(),\n                            ),\n                            child: Text(_country),\n                          ),\n                          const SizedBox(height: 14),\n                          _field('legal_name', tr('business_profile_legal'),\n                              mandatory: true, minLength: 2, maxLength: 200),\n                          _field('registration_number', tr('business_profile_reg'),\n                              maxLength: 100),\n                          _field('vat_number', tr('business_profile_vat'),\n                              maxLength: 50),\n                          Text(tr('business_profile_vat_optional')),\n                          const SizedBox(height: 14),\n                          _field('billing_address_line1',\n                              tr('business_profile_address1'),\n                              mandatory: true, minLength: 3, maxLength: 300),\n                          _field('billing_address_line2',\n                              tr('business_profile_address2'), maxLength: 300),\n                          _field('billing_city', tr('business_profile_city'),\n                              mandatory: true, minLength: 2, maxLength: 150),\n                          _field('billing_region', tr('business_profile_region'),\n                              maxLength: 150),\n                          _field('billing_postcode', tr('business_profile_postcode'),\n                              mandatory: true, minLength: 2, maxLength: 30),\n                          _field('business_activity', tr('business_profile_activity'),\n                              maxLength: 800, multiline: true),\n                          _field('evidence_reference', tr('business_profile_evidence'),\n                              maxLength: 1000, multiline: true),\n                          CheckboxListTile(\n                            contentPadding: EdgeInsets.zero,\n                            controlAffinity: ListTileControlAffinity.leading,\n                            title: Text(tr('b2b_confirmation')),\n                            value: _attested,\n                            onChanged: _saving\n                                ? null\n                                : (value) => setState(() => _attested = value ?? false),\n                          ),\n                          if (_error != null) ...[\n                            const SizedBox(height: 8),\n                            Text(_error!, style: TextStyle(color: Theme.of(context).colorScheme.error)),\n                          ],\n                          const SizedBox(height: 12),\n                          FilledButton.icon(\n                            onPressed: _saving ? null : _save,\n                            icon: _saving\n                                ? const SizedBox(\n                                    width: 16, height: 16,\n                                    child: CircularProgressIndicator(strokeWidth: 2))\n                                : const Icon(Icons.verified_outlined),\n                            label: Text(tr(_saving\n                                ? 'business_profile_saving'\n                                : 'business_profile_submit')),\n                          ),\n                        ],\n                      ),\n                    ),\n                  ],\n                ),\n              ),\n            ),\n    );\n  }\n}\n",encoding='utf-8')
