name: Flotaryx - Install Business Verification Form

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flotaryx-business-profile-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flotaryx-business-profile-installer
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install business profile page and translations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_INSTALL'
          from pathlib import Path
          import json, subprocess

          def verify_hash(path, expected):
              actual = subprocess.check_output(['git','hash-object',str(path)],text=True).strip()
              if actual != expected:
                  raise SystemExit(f'{path} changed since review; stopped safely: {actual}')

          company = Path('lib/company/company_screen.dart')
          loc = Path('lib/core/localization.dart')
          new_screen = Path('lib/company/business_verification_screen.dart')
          verify_hash(company, 'e5797c9a8ce0f8bdc7de78bc9715e52ff387ae69')
          verify_hash(loc, 'f56224e53a05ae450e6927c47a5e1c22f1e16600')
          if new_screen.exists():
              raise SystemExit('Business verification screen already exists; no changes made')

          original = company.read_text(encoding='utf-8')
          if original.count("import 'billing_screen.dart';")!=1 or original.count('        if (_canAdmin)\n          Card(\n            child: ListTile(\n              leading: const Icon(Icons.credit_card_outlined),')!=1:
              raise SystemExit('Missing unique company screen anchors; no changes made')
          modified = original.replace("import 'billing_screen.dart';", "import 'billing_screen.dart';"+"\nimport 'business_verification_screen.dart';", 1)
          modified = modified.replace('        if (_canAdmin)\n          Card(\n            child: ListTile(\n              leading: const Icon(Icons.credit_card_outlined),', "        if (_canAdmin)\n          Card(\n            child: ListTile(\n              leading: const Icon(Icons.business_center_outlined),\n              title: Text(tr('business_profile_title')),\n              subtitle: Text(tr('business_profile_subtitle')),\n              trailing: const Icon(Icons.chevron_right),\n              onTap: () => Navigator.of(context).push(\n                MaterialPageRoute<void>(\n                  builder: (_) => BusinessVerificationScreen(\n                    company: widget.company,\n                  ),\n                ),\n              ),\n            ),\n          ),\n\n"+'        if (_canAdmin)\n          Card(\n            child: ListTile(\n              leading: const Icon(Icons.credit_card_outlined),', 1)

          source = loc.read_text(encoding='utf-8')
          for lang, entries in {'pl': ['Dane firmy i weryfikacja', 'Uzupełnij dane działalności. Weryfikacja jest wymagana przed prawdziwą płatnością.', 'Pełna nazwa firmy', 'Numer rejestrowy firmy (opcjonalny)', 'Numer VAT (opcjonalny)', 'Adres – ulica i numer', 'Adres – dodatkowe informacje (opcjonalne)', 'Miasto', 'Województwo / region (opcjonalnie)', 'Kod pocztowy', 'Opis działalności (opcjonalnie)', 'Link do rejestru firmy lub inny dowód działalności (opcjonalnie)', 'Kraj rozliczeniowy firmy', 'Prześlij do weryfikacji', 'Zapisywanie...', 'Dane firmy zapisane. Oczekuj na weryfikację.', 'Nie udało się pobrać lub zapisać danych firmy.', 'Wypełnij poprawnie wymagane pole.', 'Kraj firmy jest nieprawidłowy. Skontaktuj się z pomocą.', 'Uwagi weryfikatora', 'Nie masz VAT? Możesz złożyć wniosek, podając inne dane działalności.', 'Nie przesłano danych firmy', 'Oczekuje na weryfikację', 'Wymagane dodatkowe informacje', 'Firma zweryfikowana', 'Weryfikacja odrzucona', 'Potwierdź, że działasz jako firma.'], 'en': ['Business details and verification', 'Provide your business details. Verification is required before live payments.', 'Legal business name', 'Business registration number (optional)', 'VAT number (optional)', 'Address line 1', 'Address line 2 (optional)', 'City', 'State / region (optional)', 'Postcode / ZIP', 'Business activity (optional)', 'Public business register link or other evidence (optional)', 'Company billing country', 'Submit for verification', 'Saving...', 'Business details saved. Await verification.', 'Could not load or save business details.', 'Complete this required field.', 'The business country is invalid. Contact support.', 'Reviewer notes', 'No VAT number? You can apply using other evidence of business activity.', 'Not submitted', 'Pending verification', 'More information required', 'Business verified', 'Verification rejected', 'Confirm that you are acting as a business.'], 'de': ['Firmendaten und Prüfung', 'Geben Sie Ihre Firmendaten ein. Vor Live-Zahlungen ist eine Prüfung erforderlich.', 'Rechtlicher Firmenname', 'Handelsregisternummer (optional)', 'USt-IdNr. (optional)', 'Adresszeile 1', 'Adresszeile 2 (optional)', 'Stadt', 'Bundesland / Region (optional)', 'Postleitzahl', 'Geschäftstätigkeit (optional)', 'Link zum Firmenregister oder anderer Nachweis (optional)', 'Rechnungsland der Firma', 'Zur Prüfung einreichen', 'Wird gespeichert...', 'Firmendaten gespeichert. Prüfung steht aus.', 'Firmendaten konnten nicht geladen oder gespeichert werden.', 'Pflichtfeld bitte ausfüllen.', 'Ungültiges Firmenland. Bitte Support kontaktieren.', 'Hinweise der Prüfstelle', 'Keine USt-IdNr.? Andere Nachweise der Geschäftstätigkeit sind möglich.', 'Nicht eingereicht', 'Prüfung ausstehend', 'Weitere Angaben erforderlich', 'Firma geprüft', 'Prüfung abgelehnt', 'Bestätigen Sie, dass Sie geschäftlich handeln.'], 'sk': ['Údaje o firme a overenie', 'Vyplňte údaje o firme. Pred ostrou platbou sa vyžaduje overenie.', 'Oficiálny názov firmy', 'Registračné číslo firmy (nepovinné)', 'IČ DPH (nepovinné)', 'Adresa – riadok 1', 'Adresa – riadok 2 (nepovinné)', 'Mesto', 'Kraj / región (nepovinné)', 'PSČ', 'Opis podnikania (nepovinné)', 'Odkaz na obchodný register alebo iný dôkaz (nepovinné)', 'Krajina fakturácie', 'Odoslať na overenie', 'Ukladanie...', 'Údaje uložené. Počkajte na overenie.', 'Údaje o firme sa nepodarilo načítať alebo uložiť.', 'Vyplňte povinné pole.', 'Neplatná krajina firmy. Kontaktujte podporu.', 'Poznámky overovateľa', 'Nemáte IČ DPH? Môžete doložiť iné dôkazy o podnikaní.', 'Neodoslané', 'Čaká na overenie', 'Potrebné ďalšie údaje', 'Firma overená', 'Overenie zamietnuté', 'Potvrďte, že konáte ako firma.'], 'cs': ['Údaje o firmě a ověření', 'Vyplňte údaje o firmě. Před ostrou platbou je nutné ověření.', 'Oficiální název firmy', 'Registrační číslo firmy (nepovinné)', 'DIČ (nepovinné)', 'Adresa – řádek 1', 'Adresa – řádek 2 (nepovinné)', 'Město', 'Kraj / region (nepovinné)', 'PSČ', 'Popis podnikání (nepovinné)', 'Odkaz n