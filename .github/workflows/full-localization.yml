              "'Company added successfully.'": "tr('company_added')",
              "'Try again'": "tr('try_again')",
          }

          import_lines = {
              "lib/core/widgets.dart": "import 'localization.dart';",
          }

          for filename in files:
              path = Path(filename)
              s = path.read_text(encoding="utf-8")

              if filename == "lib/core/widgets.dart":
                  needed = "import 'localization.dart';"
              else:
                  needed = "import '../core/localization.dart';"

              if needed not in s:
                  s = s.replace(
                      "import 'package:flutter/material.dart';",
                      "import 'package:flutter/material.dart';\n\n" + needed,
                      1,
                  )

              for old, new in replacements.items():
                  s = s.replace(old, new)

              # Dashboard dynamic translations.
              s = s.replace(
                  "'Termin: ${formatDate(due)}'",
                  "'${tr('due_date')}: ${formatDate(due)}'",
              )

              s = s.replace(
                  "'$operational z ${data.vehicles.length} pojazdów operacyjnych'",
                  "trf('fleet_operational', {'operational': operational, 'total': data.vehicles.length})",
              )

              # Dynamic fallback values.
              s = s.replace(
                  "repairs[i].garageName ?? tr('garage')",
                  "repairs[i].garageName ?? tr('not_assigned')",
              )

              # Any widgets using translated values cannot remain const.
              widget_names = (
                  "Text|InputDecoration|DropdownMenuItem|EmptyState|SnackBar|"
                  "SizedBox|Padding|Expanded|Card|Row|Column|ListTile|Center|Wrap"
              )

              s = re.sub(
