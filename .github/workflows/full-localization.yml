            "it": "🇮🇹 Italiano",
            "uk": "🇺🇦 Українська",
            "pt": "🇵🇹 Português",
          }

          locales = list(labels.keys())

          lines = [
              "import 'package:flutter/foundation.dart';",
              "",
              "class AppLocale {",
              "  static final ValueNotifier<String> language = ValueNotifier<String>('en');",
              "}",
              "",
              "const supportedLanguages = <String>[",
          ]

          for code in locales:
              lines.append(f"  {json.dumps(code)},")

          lines += [
              "];",
              "",
              "const languageLabels = <String, String>{",
          ]

          for code, label in labels.items():
              lines.append(
                  f"  {json.dumps(code)}: {json.dumps(label, ensure_ascii=False)},"
              )

          lines += [
              "};",
              "",
              "final Map<String, Map<String, String>> _translations = {",
          ]

          for code in locales:
              lines.append(f"  {json.dumps(code)}: <String, String>{{")
              for key, value in translations[code].items():
                  lines.append(
                      f"    {json.dumps(key)}: {json.dumps(value, ensure_ascii=False)},"
                  )
              lines.append("  },")

          lines += [
              "};",
              "",
              "String languageLabel(String code) => languageLabels[code] ?? code.toUpperCase();",
              "",
              "String tr(String key) {",
              "  final code = supportedLanguages.contains(AppLocale.language.value)",
              "      ? AppLocale.language.value",
              "      : 'en';",
              "  return _translations[code]?[key] ?? _translations['en']?[key] ?? key;",
              "}",
              "",
              "String trf(String key, Map<String, Object> values) {",
              "  var value = tr(key);",
              "  for (final entry in values.entries) {",
              "    value = value.replaceAll('{${entry.key}}', entry.value.toString());",
              "  }",
              "  return value;",
              "}",
              "",
          ]

          Path("lib/core/localization.dart").write_text(
              "\n".join(lines),
              encoding="utf-8",
          )

