          }.items():
              translations[code] = values

          # Native language labels.
          labels = {
            "pl": "🇵🇱 Polski",
            "en": "🇬🇧 English",
            "de": "🇩🇪 Deutsch",
            "sk": "🇸🇰 Slovenčina",
            "cs": "🇨🇿 Čeština",
            "hu": "🇭🇺 Magyar",
            "ro": "🇷🇴 Română",
