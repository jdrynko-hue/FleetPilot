name: Garage local Supabase Auth and RLS E2E

on:
  pull_request:
    paths:
      - 'supabase/garage_staging/**'
      - 'tests/garage_local_supabase_e2e.mjs'
      - '.github/workflows/garage-local-supabase-e2e.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/garage_staging/**'
      - 'tests/garage_local_supabase_e2e.mjs'
      - '.github/workflows/garage-local-supabase-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garage-supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GARAGE_QA_DIR: ${{ runner.temp }}/flotaryx-garage-e2e
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Prepare throwaway local Supabase project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$GARAGE_QA_DIR"
          cd "$GARAGE_QA_DIR"
          supabase init --yes
          # Never use repository Fleet migrations, links or credentials.
          # Copy ONLY the additive Garage staging schema in order.
          mkdir -p supabase/migrations
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/001_workshop_foundation.sql" \
            supabase/migrations/20261014000100_garage_workshops.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/002_staff_invites_and_diagnosis.sql" \
            supabase/migrations/20261014000200_garage_invites.sql
          cp "$GITHUB_WORKSPACE/supabase/garage_staging/003_mechanic_assignment.sql" \
            supabase/migrations/20261014000300_garage_assignments.sql
          # GoTrue signup on loopback must issue a session without contacting
          # external email providers. Never change this in hosted production.
          sed -i 's/^enable_confirmations = true$/enable_confirmations = false/' \
            supabase/config.toml
          if ! grep -q '^enable_confirmations = false$' supabase/config.toml; then
            echo 'Local Auth confirmation setting not found' >&2
            exit 1
          fi
      - name: Start local Auth, PostgREST and Postgres
        shell: bash
        run: |
          set -euo pipefail
          cd "$GARAGE_QA_DIR"
          supabase start -x studio,analytics,imgproxy
      - name: Exercise signups, tenant RLS, invites and assignment APIs
        shell: bash
        run: |
          set -euo pipefail
          cd "$GARAGE_QA_DIR"
          supabase status -o env > "$RUNNER_TEMP/garage_supabase_env"
          get_local_setting() {
            sed -n "s/^$1=//p" "$RUNNER_TEMP/garage_supabase_env" | head -1 | tr -d '"'
          }
          export GARAGE_TEST_API_URL="$(get_local_setting API_URL)"
          export GARAGE_TEST_ANON_KEY="$(get_local_setting ANON_KEY)"
          if [[ -z "$GARAGE_TEST_API_URL" || -z "$GARAGE_TEST_ANON_KEY" ]]; then
            echo 'Missing local Supabase API URL or anon key' >&2
            exit 1
          fi
          echo "::add-mask::$GARAGE_TEST_ANON_KEY"
          node "$GITHUB_WORKSPACE/tests/garage_local_supabase_e2e.mjs"
      - name: Stop isolated Supabase services
        if: always()
        shell: bash
        run: |
          if [[ -d "$GARAGE_QA_DIR/supabase" ]]; then
            cd "$GARAGE_QA_DIR"
            supabase stop --no-backup || true
          fi
