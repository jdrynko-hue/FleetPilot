name: FleetPilot - 12 Languages Product Website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fleetpilot-website-12-languages.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fleetpilot-12-language-release
  cancel-in-progress: false

jobs:
  publish-translations:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Check website version before applying translations
        shell: bash
        run: |
          set -euo pipefail
          test -f web/start/index.html
          # Prevent accidental replacement if a newer page was edited meanwhile.
          test "$(git hash-object web/start/index.html)" = '9983bff8e0991adc1d4c2839532de787da728302'

