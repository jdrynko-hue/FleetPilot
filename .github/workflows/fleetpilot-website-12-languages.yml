      - name: Verify deployment only changes public product website
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = 'web/start/index.html'
          python3 - <<'PY_VERIFY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re
          html=Path('web/start/index.html').read_text(encoding='utf-8')
          languages=['pl','en','de','sk','cs','hu','ro','es','fr','it','uk','pt']
          assert html.count('id="site-language"')==1
          assert len(re.findall(r'data-en="',html))==116
          for lang in languages:
              assert len(re.findall(r'data-'+lang+'="',html))==116,lang
          assert 'No. The current product focuses' not in html
          assert 'Rozważamy' in html and 'telematics' in html
          assert 'fleetpilot_site_lang' in html
          assert 'href="../"' in html and 'href="../install/"' in html
          print('Release ready: 12 languages, 116 sections, existing links intact')
          PY_VERIFY

      - name: Publish multilingual product website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/start/index.html
          if git diff --cached --quiet; then
            echo 'No website changes needed.'
          else
            git commit -m 'Localize FleetPilot product website in all 12 app languages'
            git push origin HEAD:main
          fi

      - name: Start GitHub Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh workflow run deploy.yml --ref main
