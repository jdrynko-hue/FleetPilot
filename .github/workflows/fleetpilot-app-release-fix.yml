name: FleetPilot - Complete Installable App Release

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fleetpilot-app-release-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  prepare-test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate web platform and restore original app package
        shell: bash
        run: |
          flutter create --platforms=web --project-name fleetpilot .
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import subprocess

          source = Path('.github/workflows/fleetpilot-app-release.yml').read_text(encoding='utf-8')
          marker = "cat <<'FLEETPILOT_APP_RELEASE' | base64 --decode | gzip --decompress > /tmp/fleetpilot_release.py"
          if source.count(marker) != 1:
              raise SystemExit('Original FleetPilot app package not found')
          payload = source.split(marker, 1)[1].split('FLEETPILOT_APP_RELEASE', 1)[0]
          script = gzip.decompress(base64.b64decode(''.join(payload.split()))).decode('utf-8')
          subprocess.run(['python3', '-c', script], check=True)

          # New Flutter templates generate an unrelated sample test referring to MyApp.
          # Only remove that untracked Flutter-generated sample, never project tests.
          sample = Path('test/widget_test.dart')
          if sample.exists():
              tracked = subprocess.run(
                  ['git', 'ls-files', '--error-unmatch', str(sample)],
                  stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL
              ).returncode == 0
              if tracked:
                  raise SystemExit('Refusing to remove tracked application test')
              if 'MyApp' not in sample.read_text(encoding='utf-8'):
                  raise SystemExit('Unrecognized generated sample; refusing to remove')
              sample.unlink()
              print('Removed unrelated Flutter sample test; real FleetPilot tests retained')
          PY

      - name: Analyze real app, run all tests and build website
        shell: bash
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build web --release --base-href "/FleetPilot/"
          test -f build/web/install/index.html
          test -f build/web/start/index.html
          test -f build/web/manifest.json
          test -f build/web/icons/Icon-192.png
          test -f build/web/icons/Icon-512.png
          grep -q 'FleetPilot' build/web/index.html

      - name: Commit only verified release files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html web/manifest.json web/favicon.png web/icons/Icon-192.png web/icons/Icon-512.png web/icons/Icon-maskable-192.png web/icons/Icon-maskable-512.png web/start/index.html web/install/index.html
          if git diff --cached --quiet; then
            echo 'FleetPilot release files already committed'
          else
            git commit -m 'Publish FleetPilot installable web app and onboarding website'
            git push
          fi

      - name: Explicitly deploy verified release on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run deploy.yml --ref main
