name: Flotaryx - Verified Domain Activation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flotaryx-domain-release-fix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: flotaryx-domain-release-fixed
  cancel-in-progress: false

jobs:
  configure-test-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Prepare Flutter web platform
        run: flutter create --platforms=web --project-name fleetpilot .

      - name: Configure Flotaryx custom-domain paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess

          workflow=Path('.github/workflows/deploy.yml')
          s=workflow.read_text(encoding='utf-8')
          assert ('--base-href "/FleetPilot/"' in s or '--base-href "/"' in s), 'Unknown web base path'
          s=s.replace('--base-href "/FleetPilot/"', '--base-href "/"')
          s=s.replace('name: Deploy FleetPilot', 'name: Deploy Flotaryx')
          workflow.write_text(s,encoding='utf-8')

          manifest_file=Path('web/manifest.json')
          manifest=json.loads(manifest_file.read_text(encoding='utf-8'))
          assert manifest['short_name']=='Flotaryx', 'Missing Flotaryx branding'
          manifest.update({'id':'/','start_url':'/','scope':'/'})
          manifest_file.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          repo=Path('lib/data/fleet_repository.dart')
          s=repo.read_text(encoding='utf-8')
          old='https://jdrynko-hue.github.io/FleetPilot/'
          new='https://flotaryx.com/'
          assert old in s or new in s, 'Missing signup email redirect'
          repo.write_text(s.replace(old,new),encoding='utf-8')

          landing=Path('web/start/index.html')
          s=landing.read_text(encoding='utf-8')
          s=s.replace('https://jdrynko-hue.github.io/FleetPilot/start/', 'https://flotaryx.com/start/')
          assert 'https://flotaryx.com/start/' in s, 'Wrong product URL'
          landing.write_text(s,encoding='utf-8')

          Path('web/CNAME').write_text('flotaryx.com\n',encoding='ascii')

          # Flutter creates a boilerplate widget test for MyApp even though this
          # repository has its own actual Flutter tests. Do not remove tracked tests.
          generated_test=Path('test/widget_test.dart')
          if generated_test.exists():
              tracked=subprocess.run(['git','ls-files','--error-unmatch',str(generated_test)],
                  stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0
              assert not tracked or 'MyApp' not in generated_test.read_text(encoding='utf-8'), \
                  'A tracked widget test unexpectedly refers to MyApp'
              if not tracked and 'MyApp' in generated_test.read_text(encoding='utf-8'):
                  generated_test.unlink()
                  print('Ignored unrelated autogenerated Flutter sample test')
          print('Configured / root path, signup URL, manifest and GitHub Pages CNAME')
          PY

      - name: Analyze and test actual Flotaryx application
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test

      - name: Build and verify production PWA
        shell: bash
        run: |
          set -euo pipefail
          flutter build web --release --base-href "/" \
            --dart-define=SUPABASE_URL=https://wqhymmtiawfwjikdaujo.supabase.co \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_j638npcsGiRpQqYbVoz1Rg_qo4vA6tt
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('build/web')
          assert '<base href="/">' in (root/'index.html').read_text(encoding='utf-8')
          assert 'Flotaryx' in (root/'index.html').read_text(encoding='utf-8')
          manifest=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          assert manifest['id']==manifest['start_url']==manifest['scope']=='/'
          assert (root/'main.dart.js').exists()
          assert (root/'flutter_bootstrap.js').exists()
          assert (root/'start/index.html').exists()
          assert (root/'install/index.html').exists()
          assert (root/'icons/Icon-512.png').exists()
          assert (root/'CNAME').read_text(encoding='ascii').strip()=='flotaryx.com'
          print('Production build verified for https://flotaryx.com/')
          PY

      - name: Commit verified Flotaryx domain configuration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/deploy.yml lib/data/fleet_repository.dart web/manifest.json web/start/index.html web/CNAME
          if git diff --cached --quiet; then
            echo 'Domain root configuration already committed.'
          else
            git commit -m 'Deploy Flotaryx from root on flotaryx.com'
            git push origin HEAD:main
          fi

      - name: Run updated GitHub Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run deploy.yml --ref main
          echo 'Requested Flotaryx GitHub Pages deployment.'
