name: Flotaryx full regression

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'web/app/index.html'
      - 'supabase/functions/**'
      - 'tests/**'
      - 'server/garage-billing/**'
      - '.github/workflows/full-regression.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'web/app/index.html'
      - 'supabase/functions/**'
      - 'tests/**'
      - 'server/garage-billing/**'
      - '.github/workflows/full-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test current Sandbox backend sources without external services
        run: node --experimental-strip-types --test tests/garage-paid-renewal.test.mjs tests/checkout.test.mjs tests/billing-manage.test.mjs tests/webhook.test.mjs tests/landing_language_handoff.test.mjs tests/garage-paid-rejoin-http.test.mjs tests/garage-paid-rejoin.test.mjs tests/garage-trial-policy.test.mjs tests/garage-checkout.test.mjs tests/garage-checkout-http.test.mjs tests/garage-entitlement-http.test.mjs tests/garage-trial-webhook.test.mjs tests/garage-trial-webhook-storage.test.mjs tests/garage-trial-cancellation.test.mjs tests/garage-trial-cancellation-http.test.mjs tests/garage-paid-webhook.test.mjs tests/garage-paid-webhook-storage.test.mjs
      - name: Type-check internal Garage Sandbox Checkout contracts
        run: npm exec --yes --package typescript@5.9.3 -- tsc --noEmit --strict --allowImportingTsExtensions --target ES2022 --module nodenext --moduleResolution nodenext server/garage-billing/paid_renewal.ts server/garage-billing/paid_renewal_http.ts server/garage-billing/http_handler.ts server/garage-billing/entitlement_http.ts server/garage-billing/checkout.ts server/garage-billing/trial_policy.ts server/garage-billing/trial_webhook.ts server/garage-billing/trial_webhook_storage.ts server/garage-billing/trial_cancellation.ts server/garage-billing/trial_cancellation_http.ts server/garage-billing/trial_cancellation_storage.ts server/garage-billing/paid_webhook.ts server/garage-billing/paid_webhook_storage.ts

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Preserve the resolved public dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: flutter-resolved-lockfile
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 3
      - name: Analyze full source tree
        run: flutter analyze --no-fatal-infos
      - name: Verify insurance and booking labels with UK daylight-saving dates
        timeout-minutes: 2
        env:
          TZ: Europe/London
        run: flutter test test/vehicle_insurance_test.dart test/garage_booking_time_text_test.dart test/garage_booking_local_start_test.dart test/garage_booking_screens_test.dart test/garage_resource_calendar_screen_test.dart --reporter expanded
      - name: Run all Flutter tests
        run: flutter test --reporter expanded
      - name: Verify QA-only ecosystem entry and private route cleanup
        run: >-
          flutter test test/ecosystem_auth_routes_test.dart test/ecosystem_access_test.dart test/email_callback_test.dart test/garage_entitlement_repository_test.dart test/garage_checkout_repository_test.dart test/garage_checkout_card_test.dart
          --dart-define=FLOTARYX_ECOSYSTEM_QA=true
          --dart-define=FLOTARYX_GARAGE_SANDBOX_ENTITLEMENT=true
          --dart-define=FLOTARYX_GARAGE_SANDBOX_CHECKOUT_CLIENT=true
          --dart-define=FLOTARYX_GARAGE_SANDBOX_CHECKOUT_UI=true
          --dart-define=SUPABASE_URL=https://fyestmquqvkdebxxbcky.supabase.co
          --dart-define=QA_AUTH_CALLBACK_URL=https://flotaryx-qa-preview.fairdrake9.chatgpt.site/app/
      - name: Verify explicit production navigation with mocked Auth
        # Exercise the production navigation flag with mocked sessions only.
        # No production API, credentials, accounts or writes are involved.
        run: >-
          flutter test test/ecosystem_auth_routes_test.dart test/ecosystem_access_test.dart test/email_callback_test.dart
          --dart-define=FLOTARYX_ECOSYSTEM_PRODUCTION=true
          --dart-define=SUPABASE_URL=https://wqhymmtiawfwjikdaujo.supabase.co
      - name: Render Garage layout previews without a backend
        run: flutter test test/garage_shell_preview.dart --update-goldens
      - name: Preserve Garage visual previews
        uses: actions/upload-artifact@v4
        with:
          name: garage-layout-preview
          path: build/garage-preview/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Stage the actual Flutter portal entrypoint
        run: cp web/app/index.html web/index.html
      - name: Compile connected Flutter web for QA without deployment
        run: >-
          flutter build web --release --no-web-resources-cdn --base-href "/app/"
          --dart-define=FLOTARYX_ECOSYSTEM_QA=true
          --dart-define=SUPABASE_URL=https://fyestmquqvkdebxxbcky.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_build_check_only
          --dart-define=QA_AUTH_CALLBACK_URL=https://flotaryx-qa-preview.fairdrake9.chatgpt.site/app/
      - name: Verify the compiled QA portal can bootstrap at its real path
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Entry(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.bases = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'base': self.bases.append(attrs.get('href'))
                  if tag == 'script': self.scripts.append(attrs.get('src'))
          output = Path('build/web')
          entry = Entry()
          entry.feed((output / 'index.html').read_text())
          assert entry.bases == ['/app/'], 'QA portal base path is incorrect'
          assert 'flutter_bootstrap.js' in entry.scripts, 'Compiled page cannot start Flutter'
          for name in ['flutter_bootstrap.js', 'main.dart.js']:
              assert (output / name).is_file() and (output / name).stat().st_size > 0, name
          print('PASS: QA portal entry, /app/ base and bootstrap assets')
          PY
      - name: Preserve the self-contained QA portal for private preview
        uses: actions/upload-artifact@v4
        with:
          name: qa-web-portal
          path: build/web
          if-no-files-found: error
          retention-days: 3
