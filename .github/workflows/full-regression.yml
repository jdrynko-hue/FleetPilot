name: Flotaryx full regression

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/functions/**'
      - 'tests/**'
      - '.github/workflows/full-regression.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/functions/**'
      - 'tests/**'
      - '.github/workflows/full-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test current Sandbox backend sources without external services
        run: node --experimental-strip-types --test tests/checkout.test.mjs tests/billing-manage.test.mjs

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze full source tree
        run: flutter analyze --no-fatal-infos
      - name: Run all Flutter tests
        run: flutter test --reporter expanded
