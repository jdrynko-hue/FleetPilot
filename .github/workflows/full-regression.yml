name: Flotaryx full regression

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'web/app/index.html'
      - 'supabase/functions/**'
      - 'tests/**'
      - 'tools/qa_artifact_integrity.py'
      - 'tools/prepare_qa_booking_swap.py'
      - 'tools/verify_flutter_toolchain.py'
      - 'tool/flutter-toolchain.json'
      - 'tools/prepare_marketing_release.py'
      - '.github/workflows/full-regression.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'web/app/index.html'
      - 'supabase/functions/**'
      - 'tests/**'
      - 'tools/qa_artifact_integrity.py'
      - 'tools/prepare_qa_booking_swap.py'
      - 'tools/verify_flutter_toolchain.py'
      - 'tool/flutter-toolchain.json'
      - 'tools/prepare_marketing_release.py'
      - '.github/workflows/full-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-artifact-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Reject incomplete or stale QA artifact inventories
        run: |
          python3 -B tests/qa_artifact_integrity_test.py -v
          python3 -B tests/qa_booking_swap_test.py -v
          python3 -B tests/flutter_toolchain_test.py -v

  sandbox-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test current Sandbox backend sources without external services
        run: node --experimental-strip-types --test tests/checkout.test.mjs tests/billing-manage.test.mjs tests/webhook.test.mjs tests/landing_language_handoff.test.mjs

  flutter:
    needs: qa-artifact-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.1'
          cache: true
      - name: Verify the pinned Flutter and Dart toolchain
        run: |
          flutter --version --machine > "$RUNNER_TEMP/flutter-toolchain.json"
          python3 -B tools/verify_flutter_toolchain.py --actual "$RUNNER_TEMP/flutter-toolchain.json"
      - run: flutter pub get
      - name: Preserve the resolved public dependency lockfile
        uses: actions/upload-artifact@v4
        with:
          name: flutter-resolved-lockfile
          path: pubspec.lock
          if-no-files-found: error
          retention-days: 3
      - name: Analyze full source tree
        run: flutter analyze --no-fatal-infos
      - name: Verify insurance and booking labels with UK daylight-saving dates
        timeout-minutes: 2
        env:
          TZ: Europe/London
        run: flutter test test/vehicle_insurance_test.dart test/garage_booking_time_text_test.dart test/garage_booking_local_start_test.dart test/garage_booking_screens_test.dart test/garage_resource_calendar_screen_test.dart --reporter expanded
      - name: Run all Flutter tests
        run: flutter test --reporter expanded
      - name: Verify durable booking markers in a real browser
        run: flutter test --platform chrome test/browser/booking_recovery_storage_test.dart --reporter expanded
      - name: Verify QA-only ecosystem entry and private route cleanup
        run: >-
          flutter test test/ecosystem_auth_routes_test.dart test/ecosystem_access_test.dart test/email_callback_test.dart
          --dart-define=FLOTARYX_ECOSYSTEM_QA=true
          --dart-define=SUPABASE_URL=https://fyestmquqvkdebxxbcky.supabase.co
          --dart-define=QA_AUTH_CALLBACK_URL=https://flotaryx-qa-preview.fairdrake9.chatgpt.site/app/
      - name: Verify explicit production navigation with mocked Auth
        # Exercise the production navigation flag with mocked sessions only.
        # No production API, credentials, accounts or writes are involved.
        run: >-
          flutter test test/ecosystem_auth_routes_test.dart test/ecosystem_access_test.dart test/email_callback_test.dart
          --dart-define=FLOTARYX_ECOSYSTEM_PRODUCTION=true
          --dart-define=SUPABASE_URL=https://wqhymmtiawfwjikdaujo.supabase.co
      - name: Render Garage layout previews without a backend
        run: flutter test test/garage_shell_preview.dart --update-goldens
      - name: Preserve Garage visual previews
        uses: actions/upload-artifact@v4
        with:
          name: garage-layout-preview
          path: build/garage-preview/*.png
          if-no-files-found: error
          retention-days: 7
      - name: Stage the actual Flutter portal entrypoint
        run: cp web/app/index.html web/index.html
      - name: Compile connected Flutter web for QA without deployment
        run: >-
          flutter build web --release --no-web-resources-cdn --base-href "/app/"
          --dart-define=FLOTARYX_ECOSYSTEM_QA=true
          --dart-define=FLOTARYX_BOOKING_RECOVERY_QA=true
          --dart-define=SUPABASE_URL=https://fyestmquqvkdebxxbcky.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_build_check_only
          --dart-define=QA_AUTH_CALLBACK_URL=https://flotaryx-qa-preview.fairdrake9.chatgpt.site/app/
      - name: Verify the compiled QA portal can bootstrap at its real path
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Entry(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.bases = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'base': self.bases.append(attrs.get('href'))
                  if tag == 'script': self.scripts.append(attrs.get('src'))
          output = Path('build/web')
          entry = Entry()
          entry.feed((output / 'index.html').read_text())
          assert entry.bases == ['/app/'], 'QA portal base path is incorrect'
          assert 'flutter_bootstrap.js' in entry.scripts, 'Compiled page cannot start Flutter'
          for name in ['flutter_bootstrap.js', 'main.dart.js']:
              assert (output / name).is_file() and (output / name).stat().st_size > 0, name
          print('PASS: QA portal entry, /app/ base and bootstrap assets')
          PY
      - name: Inventory all QA build bytes without authorizing publication
        run: |
          flutter --version --machine > build/web/qa-build-toolchain.json
          cp pubspec.lock build/web/qa-build-pubspec.lock
          cp .github/workflows/full-regression.yml build/web/qa-build-workflow.yml
          python3 -B tools/qa_artifact_integrity.py create --root build/web \
            --declared-source-commit "$(git rev-parse HEAD)" \
            --declared-source-tree "$(git rev-parse 'HEAD^{tree}')" > "$RUNNER_TEMP/qa-inventory-receipt.json"
          cat "$RUNNER_TEMP/qa-inventory-receipt.json"
          manifest_sha=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["manifest_sha256"])' "$RUNNER_TEMP/qa-inventory-receipt.json")
          python3 -B tools/qa_artifact_integrity.py verify --root build/web --manifest-sha256 "$manifest_sha"
          echo "QA inventory SHA-256: $manifest_sha (integrity only; deployment not authorized)" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve the self-contained QA portal for private preview
        uses: actions/upload-artifact@v4
        with:
          name: qa-web-portal
          path: build/web
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3
