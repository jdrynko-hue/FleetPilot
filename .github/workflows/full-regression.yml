name: Flotaryx full regression

on:
  pull_request:
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/functions/**'
      - 'tests/**'
      - '.github/workflows/full-regression.yml'
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'supabase/functions/**'
      - 'tests/**'
      - '.github/workflows/full-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-regression-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test current Sandbox backend sources without external services
        run: node --experimental-strip-types --test tests/checkout.test.mjs tests/billing-manage.test.mjs tests/webhook.test.mjs

  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analyze full source tree
        run: flutter analyze --no-fatal-infos
      - name: Verify insurance and booking labels with UK daylight-saving dates
        timeout-minutes: 2
        env:
          TZ: Europe/London
        run: flutter test test/vehicle_insurance_test.dart test/garage_booking_time_text_test.dart test/garage_booking_screens_test.dart test/garage_resource_calendar_screen_test.dart --reporter expanded
      - name: Run all Flutter tests
        run: flutter test --reporter expanded
      - name: Verify QA-only ecosystem entry and private route cleanup
        run: >-
          flutter test test/ecosystem_auth_routes_test.dart test/ecosystem_access_test.dart
          --dart-define=FLOTARYX_ECOSYSTEM_QA=true
          --dart-define=SUPABASE_URL=https://fyestmquqvkdebxxbcky.supabase.co
      - name: Compile connected Flutter web for QA without deployment
        run: >-
          flutter build web --release
          --dart-define=FLOTARYX_ECOSYSTEM_QA=true
          --dart-define=SUPABASE_URL=https://fyestmquqvkdebxxbcky.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_build_check_only
