name: FleetPilot - Installable App and Public Website

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fleetpilot-app-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare-web-app:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable

