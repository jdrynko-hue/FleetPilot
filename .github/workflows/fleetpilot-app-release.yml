      - name: Verify code and release web app
        shell: bash
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos
          flutter test
          flutter build web --release --base-href "/FleetPilot/"
          test -f build/web/install/index.html
          test -f build/web/start/index.html
          test -f build/web/manifest.json
          test -f build/web/icons/Icon-192.png
          test -f build/web/icons/Icon-512.png
          grep -q 'FleetPilot' build/web/index.html

      - name: Save successful release to main
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add web/index.html web/manifest.json web/favicon.png web/icons/Icon-192.png web/icons/Icon-512.png web/icons/Icon-maskable-192.png web/icons/Icon-maskable-512.png web/start/index.html web/install/index.html
          if git diff --cached --quiet; then
            echo 'Installable web app already prepared.'
          else
            git commit -m 'Prepare FleetPilot installable web app and website'
            git push
          fi
          echo 'GitHub Pages deploy workflow runs automatically after push.'
