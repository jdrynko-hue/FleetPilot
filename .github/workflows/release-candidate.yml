name: Release candidate static checks
on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/test_release_candidate.py'
      - 'tests/test_release_integrity.py'
      - 'tests/test_garage_stripe_test_inventory.py'
      - 'web/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/deploy.yml'
      - '.github/workflows/release-candidate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run static and integrity negative tests
        run: |
          python -m unittest discover -s tests -p 'test_release_candidate.py' -v
          python -m unittest discover -s tests -p 'test_release_integrity.py' -v
          python -m unittest discover -s tests -p 'test_garage_stripe_test_inventory.py' -v

  compiled-qa-release:
    # This checks actual compiled files, NOT a synthetic fixture or hosted service.
    # Never deploy or call production: no Pages permission, production key or JWT.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Flutter web without altering marketing source
        run: |
          flutter create --platforms=web --project-name fleetpilot .
          flutter pub get
          cp web/app/index.html web/index.html
      - name: Build QA portal, with no hosted writes or deployment
        run: >-
          flutter build web --release --no-web-resources-cdn
          --base-href "/app/"
          --dart-define=FLOTARYX_ECOSYSTEM_QA=true
          --dart-define=SUPABASE_URL=https://fyestmquqvkdebxxbcky.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_build_check_only
      - name: Assemble the exact GitHub Pages layout without publishing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p site/app
          cp -a web/. site/
          git show HEAD:web/index.html > site/index.html
          sed -i 's|<base href="\$FLUTTER_BASE_HREF">|<base href="/">|' site/index.html
          cp -a build/web/. site/app/
      - name: Validate real bundled landing, portal, PWA, legal and private-key safety
        run: python3 tools/verify_release_candidate.py site
      - name: Record and check file hashes and QA-only commit provenance
        run: |
          python3 tools/release_integrity.py write site --commit "$GITHUB_SHA"
          python3 tools/release_integrity.py check site --commit "$GITHUB_SHA"
      - name: Preserve verified unpublished QA release candidate
        uses: actions/upload-artifact@v4
        with:
          name: qa-release-candidate-site
          path: site/
          if-no-files-found: error
          retention-days: 3
          compression-level: 6
