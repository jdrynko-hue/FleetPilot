name: Isolated ordinary Garage PostgREST acceptance only

on:
  push:
    branches: [qa/ordinary-postgrest-20261025]

permissions:
  contents: read

jobs:
  http-acceptance:
    if: github.repository == 'jdrynko-hue/FleetPilot' && github.event.repository.private == false && github.ref == 'refs/heads/qa/ordinary-postgrest-20261025'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: postgres:17-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    env:
      GARAGE_POSTGREST_DISPOSABLE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # reviewed checkout@v4
        with:
          persist-credentials: false
      - name: Install Python inside disposable container
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y --no-install-recommends python3 ca-certificates
      - name: Verify HTTP authorization and persisted state
        shell: bash
        run: bash tools/run_garage_progress_postgrest_ci.sh

# Local proposal only. No new remote write or run approved by earlier native8 scope.
# No hosted connection, account/secret input, TCP service, deployment or artifact upload.
